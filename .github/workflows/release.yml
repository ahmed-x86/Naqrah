name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: gcc_64
            artifact: Naqrah-Linux
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_mingw
            artifact: Naqrah-Windows

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - name: Build Project (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Build Project (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Naqrah-Windows
          $exe = if (Test-Path "build\Naqrah.exe") { "build\Naqrah.exe" } else { "build\Release\Naqrah.exe" }
          Copy-Item $exe -Destination Naqrah-Windows\
          windeployqt --compiler-runtime Naqrah-Windows\Naqrah.exe
          Compress-Archive -Path Naqrah-Windows -DestinationPath Naqrah-Windows.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir Naqrah-Linux
          cp build/Naqrah Naqrah-Linux/
          tar -czvf Naqrah-Linux.tar.gz Naqrah-Linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.tar.gz

  build-android:
    name: Build on Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Qt Desktop (Host tools)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          arch: 'gcc_64'

      # لازم نحفظ مسار الـ Qt الديسكتوب (Host) دلوقتي، لأن تثبيت نسخة الأندرويد الجاية
      # هيكتب فوق QT_ROOT_DIR، وCMake محتاج المسار ده صراحةً عشان الـ cross-compile
      - name: Save Host Qt Path
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> $GITHUB_ENV

      # تثبيت Qt للأندرويد مع السماح للأداة بضبط الـ NDK والـ SDK المناسب تلقائياً دون تعارض
      - name: Setup Qt for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Build APK
        run: |
          mkdir build
          cd build
          # لازم نمرر QT_HOST_PATH صراحةً، وإلا CMake مش هيلاقي أدوات الـ host (moc/rcc/androiddeployqt)
          qt-cmake .. -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DQT_HOST_PATH="$QT_HOST_PATH"
          cmake --build .
          # target الـ apk مش جزء من البناء الافتراضي في Qt6، لازم نطلبه صراحةً
          cmake --build . --target apk

      - name: Find and Copy APK
        run: |
          find build -name "*.apk" -exec cp {} Naqrah-Android-arm64-v8a.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android
          path: Naqrah-Android-arm64-v8a.apk

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}