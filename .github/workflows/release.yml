  # ===== ويندوز - مستقل تمامًا عن سلسلة اللينكس (glibc/musl) =====
  build-windows:
    name: Build on windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install UPX (Windows)
        run: choco install upx

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-latest-desktop

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-bin-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri App
        run: cargo tauri build

      - name: Compress Windows Binary
        run: upx --best --lzma target/release/naqrah.exe || true

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Naqrah-Windows
          Copy-Item target\release\naqrah.exe -Destination Naqrah-Windows\
          Copy-Item icon.ico -Destination Naqrah-Windows\
          Compress-Archive -Path Naqrah-Windows -DestinationPath Naqrah-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Windows
          path: Naqrah-Windows.zip

  # ===== Alpine (musl) - المرحلة السريعة: باينري ELF فقط، بدون تغليف .apk =====
  # الهدف: إنتاج naqrah-elf-musllibc بأسرع وقت ممكن عشان build-void يقدر يبدأ
  # فورًا، من غير ما ينتظر تغليف .apk بأداة abuild (build-alpine-apk).
  build-alpine-elf:
    name: Build Alpine ELF (musl libc)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apk update
          apk add --no-cache build-base rust cargo git pkgconf \
            webkit2gtk-4.1-dev gtk+3.0-dev librsvg-dev patchelf upx \
            libayatana-appindicator-dev dbus-dev openssl-dev \
            tar

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: alpine-latest-desktop

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-alpine-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri Binary
        run: cargo tauri build --no-bundle

      - name: Compress Binary
        run: upx --best --lzma target/release/naqrah || true

      - name: Prepare musl ELF Binary
        run: cp target/release/naqrah naqrah-elf-musllibc

      - name: Upload Alpine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: naqrah-elf-musllibc

  # ===== Alpine (musl) - arm64 - باينري ELF فقط، من غير أي تغليف حاليًا =====
  # نفس أسلوب build-alpine-elf بالظبط بس على معمارية arm64 (ubuntu-24.04-arm).
  # مفاتيح الكاش لازم تختلف عن نسخة x86_64 عشان ما يحصلش تصادم.
  # ملحوظة مهمة: شيلنا "container: image: alpine:latest" من مستوى الجوب.
  # السبب: أكشنز زي actions/checkout و actions/cache و actions/upload-artifact
  # هي JavaScript Actions، وجيت-هَب مبيدعمهاش جوه كونتينر Alpine (musl) إلا
  # على رانرز x64 بس. على arm64 بتفشل فورًا بخطأ:
  # "JavaScript Actions in Alpine containers are only supported on x64 Linux runners."
  # الحل: نخلي الـ checkout/cache/upload يشتغلوا طبيعي على الرانر نفسه
  # (ubuntu-24.04-arm وهو Ubuntu عادي، مش Alpine)، ونستخدم docker run يدويًا
  # عشان نعمل البناء الفعلي جوه كونتينر Alpine حقيقي (musl libc).
  build-alpine-elf-arm64:
    name: Build Alpine ELF (musl libc, arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # كاش لمجلد cargo (registry/git) ومجلد target، بنخزنهم في مسار على
      # الهوست وبعدين بنعمل mount ليهم جوه كونتينر Alpine عشان الكاش يفضل شغال
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo-alpine-arm64
            target
          key: alpine-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            alpine-arm64-cargo-

      # كل خطوات التثبيت والبناء بقت جوه سطر واحد (docker run) بيشغل
      # كونتينر Alpine حقيقي، بدل ما الجوب كله يكون جواه (وده اللي كان بيكسر
      # الأكشنز الجاهزة). $GITHUB_WORKSPACE بيتعمله mount عشان الكونتينر
      # يشتغل على نفس ملفات المشروع، والتغييرات (الباينري الناتج) بترجع
      # تلقائيًا للهوست لأنه bind mount مش نسخة.
      - name: Build inside Alpine container (musl, arm64)
        run: |
          mkdir -p "$HOME/.cargo-alpine-arm64"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.cargo-alpine-arm64:/root/.cargo" \
            -w /workspace \
            alpine:latest \
            sh -c "
              set -e
              apk update
              apk add --no-cache build-base rust cargo git pkgconf \
                webkit2gtk-4.1-dev gtk+3.0-dev librsvg-dev patchelf upx \
                libayatana-appindicator-dev dbus-dev openssl-dev tar
              cargo install tauri-cli --version '^${{ env.TAURI_CLI_VERSION }}' --locked
              cargo tauri build --no-bundle
              upx --best --lzma target/release/naqrah || true
            "

      - name: Prepare musl ELF Binary
        run: cp target/release/naqrah naqrah-elf-musllibc-arm64

      - name: Upload Alpine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl-arm64
          path: naqrah-elf-musllibc-arm64

  # ===== Alpine (musl) - تغليف حزمة .apk رسمية بأداة abuild =====
  # يعتمد بس على الباينري الجاهز من build-alpine-elf (مش على إعادة بناء المشروع)
  build-alpine-apk:
    name: Build Alpine .apk Package
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl ELF Binary
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: elf-src

      # apk update ضروري هنا: بدونه ما يكون عندنا فهرس محلي للمستودعات،
      # فـ abuild يفشل في حل الاعتماديات المذكورة في APKBUILD (depends=...)
      # حتى لو الحزم موجودة فعليًا في مستودعات Alpine
      - name: Install abuild Tooling
        run: |
          apk update
          apk add --no-cache alpine-sdk sudo

      - name: Create Non-root Build User
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate abuild Signing Key
        run: su builder -c "abuild-keygen -a -i -n"

      - name: Prepare APKBUILD Sources
        run: |
          mkdir -p apk-pkg
          cp elf-src/naqrah-elf-musllibc apk-pkg/naqrah
          cp naqrah.desktop apk-pkg/naqrah.desktop
          cp iconn.png apk-pkg/naqrah.png

          cat > apk-pkg/APKBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=0
          pkgdesc="Arabic text diacritics (Tashkeel) editor - محرر تشكيل النصوص العربية"
          url="https://github.com/ahmed-x86/Naqrah"
          arch="x86_64"
          license="GPL"
          depends="webkit2gtk-4.1 gtk+3.0 librsvg libayatana-appindicator dbus"
          options="!strip !check"
          source="naqrah naqrah.desktop naqrah.png"

          package() {
              install -Dm755 "$srcdir"/naqrah "$pkgdir"/usr/bin/naqrah
              install -Dm644 "$srcdir"/naqrah.desktop "$pkgdir"/usr/share/applications/naqrah.desktop
              install -Dm644 "$srcdir"/naqrah.png "$pkgdir"/usr/share/icons/hicolor/256x256/apps/naqrah.png
          }
          EOF
          sed -i 's/^          //' apk-pkg/APKBUILD

      - name: Build .apk Package with abuild
        run: |
          chmod +x apk-pkg/naqrah
          chown -R builder:builder apk-pkg
          cd apk-pkg
          su builder -c "cd \$(pwd) && abuild checksum && abuild -r"
          find ~builder/packages -name "*.apk" -exec cp {} ../Naqrah-Alpine.apk \;

      - name: Upload Alpine .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Alpine-apk
          path: Naqrah-Alpine.apk

  # ===== تغليف حزمة Arch Linux (بدون بناء) =====
  # بيستنى الباينري الجاهز من build-linux-elf بس (مش تغليف deb/rpm ولا ويندوز)
  build-arch:
    name: Build Arch Package (PKGBUILD)
    needs: build-linux-elf
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download glibc Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: elf-src

      - name: Install Packaging Dependencies
        run: pacman -Syu --noconfirm --needed sudo

      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp elf-src/naqrah-elf-glibc arch-pkg/naqrah
          chmod +x arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor - محرر تشكيل النصوص العربية"
          arch=('x86_64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-x86_64.pkg.tar.zst ../Naqrah-Linux.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-pkg
          path: Naqrah-Linux.pkg.tar.zst

  build-arch-arm64:
    name: Build Arch Package (PKGBUILD - arm64)
    needs: build-linux-elf-arm64
    runs-on: ubuntu-24.04-arm
    container:
      image: agners/archlinuxarm
    steps:
      # لازم نعمل الخطوة دي قبل الـ Checkout عشان صورة agners/archlinuxarm
      # مجردة (minimal) ومفيهاش tar ولا git، وactions/checkout بيحتاج tar
      # يفك الأرشيف اللي بيحمله عن طريق GitHub REST API (بما إن git مش موجودة).
      # من غير الخطوة دي، الـ checkout بيفشل بـ "Unable to locate executable file: tar"
      - name: Install Packaging Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinuxarm || true
          pacman -Syu --noconfirm --needed sudo base-devel

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download glibc Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-arm64
          path: elf-src

      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp elf-src/naqrah-elf-glibc-arm64 arch-pkg/naqrah
          chmod +x arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor - محرر تشكيل النصوص العربية"
          arch=('aarch64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-aarch64.pkg.tar.zst ../Naqrah-Linux-arm64.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-arm64-pkg
          path: Naqrah-Linux-arm64.pkg.tar.zst

  # ===== تغليف باينري musl كحزمة Arch (.pkg.tar.zst) - نفس أسلوب نسخة glibc بالظبط =====
  # ملاحظة: دي تغليف بسيط للباينري الجاهز، مش تحقق من التوافق مع كل توزيعة
  build-arch-musl:
    name: Build Arch Package (PKGBUILD — musl)
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: elf-src

      - name: Install Packaging Dependencies
        run: pacman -Syu --noconfirm --needed sudo

      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp elf-src/naqrah-elf-musllibc arch-pkg/naqrah
          chmod +x arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor (musl build) - محرر تشكيل النصوص العربية"
          arch=('x86_64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-x86_64.pkg.tar.zst ../Naqrah-Linux-musl.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-musl-pkg
          path: Naqrah-Linux-musl.pkg.tar.zst

  build-arch-musl-arm64:
    name: Build Arch Package (PKGBUILD — musl, arm64)
    needs: build-alpine-elf-arm64
    runs-on: ubuntu-24.04-arm
    container:
      image: agners/archlinuxarm
    steps:
      # نفس السبب زي نسخة glibc arm64: لازم نجيب tar قبل الـ checkout
      # عشان صورة agners/archlinuxarm ملهاش tar ولا git افتراضيًا
      - name: Install Packaging Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinuxarm || true
          pacman -Syu --noconfirm --needed sudo base-devel

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl Binary Artifact (arm64)
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl-arm64
          path: elf-src

      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp elf-src/naqrah-elf-musllibc-arm64 arch-pkg/naqrah
          chmod +x arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor (musl build) - محرر تشكيل النصوص العربية"
          arch=('aarch64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-aarch64.pkg.tar.zst ../Naqrah-Linux-musl-arm64.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-musl-arm64-pkg
          path: Naqrah-Linux-musl-arm64.pkg.tar.zst

  # ===== تغليف حزم Void Linux (بدون بناء) =====
  # بيستنى الباينري الجاهز بس من build-linux-elf (glibc) و build-alpine-elf (musl)،
  # مش لازم ينتظر تغليف deb/rpm ولا حزمة .apk ولا بناء ويندوز
  build-void:
    name: Build Void Linux Packages (.xbps — glibc + musl)
    needs: [build-linux-elf, build-alpine-elf]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          xbps-install -Suy xbps
          xbps-install -Suy
          xbps-install -y base-devel

      - name: Download glibc Binary Artifact (From Ubuntu Job)
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: void-glibc-src

      - name: Download musl Binary Artifact (From Alpine Job)
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: void-musl-src

      - name: Prepare Package Root (glibc)
        run: |
          PKG_ROOT="void-pkg-root"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp void-glibc-src/naqrah-elf-glibc "${PKG_ROOT}/usr/bin/naqrah"
          chmod +x "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

      - name: Build glibc .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64 \
            -n naqrah-1.0.0_1 \
            -s "Arabic text diacritics (Tashkeel) editor" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/Naqrah" \
            --maintainer "ahmed-x86" \
            void-pkg-root

          # التعديل هنا: استخدمنا الاسم الصريح بدل النجمة
          mv naqrah-1.0.0_1.x86_64.xbps Naqrah-Void-glibc.xbps

      - name: Upload Void glibc Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Void-glibc-xbps
          path: Naqrah-Void-glibc.xbps

      - name: Prepare Package Root (musl)
        run: |
          PKG_ROOT="void-pkg-root-musl"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp void-musl-src/naqrah-elf-musllibc "${PKG_ROOT}/usr/bin/naqrah"
          chmod +x "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

      - name: Build musl .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64-musl \
            -n naqrah-1.0.0_1 \
            -s "Arabic text diacritics (Tashkeel) editor" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/Naqrah" \
            --maintainer "ahmed-x86" \
            void-pkg-root-musl

          # التعديل هنا: استخدمنا الاسم الصريح بدل النجمة
          mv naqrah-1.0.0_1.x86_64-musl.xbps Naqrah-Void-musl.xbps

      - name: Upload Void musl Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Void-musl-xbps
          path: Naqrah-Void-musl.xbps

  # ===== تغليف حزم Void Linux (بدون بناء) (arm64) =====
