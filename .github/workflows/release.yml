name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_CLI_VERSION: "2.0.0"

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Naqrah-Linux
          - os: windows-latest
            artifact: Naqrah-Windows

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إعداد بيئة لينكس (Tauri dependencies + UPX + أدوات التغليف)
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf upx-ucl rpm zstd

      # 2. إعداد بيئة ويندوز (UPX)
      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # كاش لمكتبات ومشروع Rust (target/, registry)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-desktop

      # كاش binary أداة tauri-cli نفسها. المفتاح هنا لازم يتطابق بالظبط بين
      # خطوة "Cache" وخطوة "Install" عشان cache-hit يشتغل صح.
      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-bin-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # 3. بناء تطبيق سطح المكتب
      - name: Build Tauri App
        run: cargo tauri build

      # 4. ضغط الملفات التنفيذية لأقصى درجة (Extreme Compression)
      - name: Compress Linux Binary
        if: runner.os == 'Linux'
        run: upx --best --lzma target/release/naqrah || true

      - name: Compress Windows Binary
        if: runner.os == 'Windows'
        run: upx --best --lzma target/release/naqrah.exe || true

      # ===== تغليف لينكس: ELF مباشر + .deb + .rpm + .pkg.tar.zst =====

      # رفع ملف ELF مباشرة بدون أي ضغط وتسميته naqrah-elf-glibc
      - name: Prepare Linux ELF Binary
        if: runner.os == 'Linux'
        run: cp target/release/naqrah naqrah-elf-glibc

      - name: Upload Linux ELF Binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: naqrah-elf-glibc

      # بناء حزمة .deb (Debian / Ubuntu)
      - name: Build .deb Package
        if: runner.os == 'Linux'
        run: |
          PKG_ROOT="deb-build/naqrah_1.0.0_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp target/release/naqrah "${PKG_ROOT}/usr/bin/"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: naqrah
          Version: 1.0.0
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: Naqrah - Arabic text diacritics (Tashkeel) editor
           محرر تشكيل النصوص العربية بواجهة رسومية حديثة
          Section: utils
          Priority: optional
          EOF

          # إزالة المسافات البادئة من ملف control (heredoc بيضيف مسافات)
          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb Naqrah-Linux.deb

      - name: Upload .deb Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-deb
          path: Naqrah-Linux.deb

      # بناء حزمة .rpm (Fedora / RHEL / openSUSE)
      - name: Build .rpm Package
        if: runner.os == 'Linux'
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}

          # تجهيز الملفات المصدرية
          mkdir -p rpmbuild/SOURCES/naqrah-1.0.0
          cp target/release/naqrah rpmbuild/SOURCES/naqrah-1.0.0/
          cp naqrah.desktop rpmbuild/SOURCES/naqrah-1.0.0/
          cp iconn.png rpmbuild/SOURCES/naqrah-1.0.0/naqrah.png
          tar -czf rpmbuild/SOURCES/naqrah-1.0.0.tar.gz -C rpmbuild/SOURCES naqrah-1.0.0

          cat > rpmbuild/SPECS/naqrah.spec <<'SPEC'
          Name:           naqrah
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Arabic text diacritics (Tashkeel) editor
          License:        GPL
          Source0:        naqrah-1.0.0.tar.gz

          %description
          Naqrah - محرر تشكيل النصوص العربية بواجهة رسومية حديثة

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp naqrah %{buildroot}/usr/bin/
          cp naqrah.desktop %{buildroot}/usr/share/applications/
          cp naqrah.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/

          %files
          /usr/bin/naqrah
          /usr/share/applications/naqrah.desktop
          /usr/share/icons/hicolor/256x256/apps/naqrah.png
          SPEC

          # إزالة المسافات البادئة
          sed -i 's/^          //' rpmbuild/SPECS/naqrah.spec

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/naqrah.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} Naqrah-Linux.rpm \;

      - name: Upload .rpm Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-rpm
          path: Naqrah-Linux.rpm

      # ملاحظة: باكدج Arch (.pkg.tar.zst) عاد بقى ليه job منفصل (build-arch) بيستخدم
      # PKGBUILD + makepkg -s فعليًا بدل التلفيق اليدوي بـ .PKGINFO + tar اللي كان هنا.
      # نفس الكلام لـ Void Linux (.xbps) في job (build-void).

      # ===== تغليف ويندوز =====
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Naqrah-Windows
          Copy-Item target\release\naqrah.exe -Destination Naqrah-Windows\
          Copy-Item icon.ico -Destination Naqrah-Windows\
          Compress-Archive -Path Naqrah-Windows -DestinationPath Naqrah-Windows.zip

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Windows
          path: Naqrah-Windows.zip

  # ===== إضافة بيئة Alpine Linux (musl libc) =====
  build-alpine:
    name: Build Alpine Linux (musl libc)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apk update
          apk add --no-cache build-base rust cargo git pkgconf \
            webkit2gtk4.1-dev gtk+3.0-dev librsvg-dev patchelf upx \
            libayatana-appindicator-dev dbus-dev openssl-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri Binary
        run: cargo tauri build --no-bundle

      - name: Compress Binary
        run: upx --best --lzma target/release/naqrah || true

      - name: Prepare musl ELF Binary
        run: cp target/release/naqrah naqrah-elf-musllibc

      - name: Upload Alpine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: naqrah-elf-musllibc

  # ===== بناء حزمة Arch Linux باستخدام PKGBUILD + makepkg -s (مش .PKGINFO يدوي) =====
  # بيشتغل جوه container أرش نفسه عشان الباينري يتبني ويتربط بنسخة glibc/الاعتماديات
  # المتوفرة فعليًا على أرش، بدل ما نعتمد على باينري اتبنى على ubuntu-latest.
  build-arch:
    name: Build Arch Package (PKGBUILD)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed rust webkit2gtk-4.1 libappindicator-gtk3 librsvg patchelf upx git sudo

      # makepkg بيرفض يشتغل بمستخدم root، فلازم نعمل مستخدم عادي ونديله صلاحية
      # الكتابة على مجلد المشروع كامل قبل ما نستخدمه في أي خطوة لاحقة.
      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install Tauri CLI
        run: su builder -c "cargo install tauri-cli --version \"^${{ env.TAURI_CLI_VERSION }}\" --locked"

      # بنبني الباينري بس من غير باندلات Tauri الافتراضية، لأن التغليف هيتعمل بـ PKGBUILD
      - name: Build Tauri Binary
        run: su builder -c 'export PATH="$HOME/.cargo/bin:$PATH" && cargo tauri build --no-bundle'

      - name: Compress Binary
        run: upx --best --lzma target/release/naqrah || true

      # ملفات الـ source اللي هيشير لها PKGBUILD لازم تكون جنب بعض في نفس المجلد
      # عشان makepkg يعرف ينسخهم لـ src/ تلقائيًا (source محلي بدون رابط تحميل)
      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp target/release/naqrah arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor - محرر تشكيل النصوص العربية"
          arch=('x86_64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-x86_64.pkg.tar.zst ../Naqrah-Linux.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-pkg
          path: Naqrah-Linux.pkg.tar.zst

  # ===== بناء حزمة Void Linux (glibc) بصيغة .xbps =====
  # xbps-create هي الأداة الرسمية لتغليف باينري جاهز كحزمة xbps من غير الحاجة
  # لكامل نظام xbps-src/templates (زيها زي checkinstall بس رسمية من Void).
  build-void:
    name: Build Void Linux Package (.xbps)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # أسماء الحزم في Void مختلفة عن Arch/Debian:
      # libwebkit2gtk41-devel (اسم باكدج webkit2gtk في Void لحد الإصدار 4.1، مش "webkit2gtk-devel")
      # + libayatana-appindicator-devel (مش libappindicator) + gtk+3-devel (مش gtk+3 اللي هي runtime بس)
      - name: Install System Dependencies
        run: |
          xbps-install -Suy xbps
          xbps-install -Suy
          xbps-install -y base-devel rust cargo libwebkit2gtk41-devel gtk+3-devel libayatana-appindicator-devel librsvg-devel patchelf upx git

      - name: Build Tauri Binary
        run: cargo tauri build --no-bundle || (cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked && cargo tauri build --no-bundle)

      - name: Compress Binary
        run: upx --best --lzma target/release/naqrah || true

      # تجهيز شجرة الملفات زي ما هتتنصب فعليًا على جهاز المستخدم
      - name: Prepare Package Root
        run: |
          PKG_ROOT="void-pkg-root"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp target/release/naqrah "${PKG_ROOT}/usr/bin/"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

      - name: Build .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64 \
            -n naqrah-1.0.0_1 \
            -s "Arabic text diacritics (Tashkeel) editor" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/Naqrah" \
            --maintainer "ahmed-x86" \
            void-pkg-root
            
          # إعادة تسمية الملف الناتج ليتوافق مع خطوة الرفع
          mv *.xbps Naqrah-Void.xbps

      - name: Upload Void Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Void-xbps
          path: Naqrah-Void.xbps

  # ملاحظة: الـ job ده بيشتغل على ubuntu-latest برضو، لكن ده مش تكرار لبناء Linux desktop.
  # ubuntu هنا مجرد "runner" (بيئة تشغيل) لبناء APK الأندرويد عن طريق NDK + Tauri Android.
  # الناتج هنا (.apk) مختلف تمامًا عن ناتج build-desktop (.tar.gz / .zip).
  #
  # ده الـ APK "العام/الشامل" (Universal) — بيحتوي على كل المعماريات جوه ملف واحد
  # فبيشتغل على أي جهاز أندرويد بدون ما المستخدم يحتاج يعرف معماريته.
  # حجمه أكبر من نسخ المعماريات المنفصلة، لكنه أسهل وأضمن لمعظم الناس.
  build-android-universal:
    name: Build Android APK (Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-universal

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-universal-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # كاش مجلد gen/android لتفادي إعادة تهيئة مشروع الأندرويد بالكامل كل مرة
      # v2: cache key متغير عشان نتخلص من أي نسخة مكسورة محفوظة سابقاً
      - name: Cache Android project
        uses: actions/cache@v4
        with:
          path: gen/android
          key: android-gen-v2-universal-${{ hashFiles('tauri.conf.json') }}

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.nagrah"/g' tauri.conf.json
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      # نولّد أيقونات كل المنصات (بما فيها أندرويد) من نفس ملف iconn.png
      # عشان أيقونة الـ APK تطابق أيقونة سطح المكتب. لازم تتنفذ بعد تهيئة
      # مجلد gen/android (سواء جديد أو مسترجع من الكاش) عشان تلاقي المسار
      # الصحيح وتحدّث الـ mipmap resources بتاعته.
      - name: Regenerate Icons (sync with iconn.png)
        run: cargo tauri icon iconn.png

      # فك تشفير الـ keystore من السيكرت وحفظه كملف مؤقت للتوقيع
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > naqrah-release.keystore

      # ملف الإعدادات اللي Gradle هيقرأه (بعد ما نربطه بـ build.gradle.kts في الخطوة الجاية)
      - name: Create Signing Properties
        run: |
          cat > gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/naqrah-release.keystore
          EOF

      # الخطوة الحاسمة: Tauri Android CLI مبيربطش keystore.properties بالـ signing تلقائيًا.
      # لازم نضيف signingConfigs في build.gradle.kts يدويًا ونربطها بـ buildTypes.release،
      # وإلا الـ APK هيتبني "unsigned" حتى لو keystore.properties موجود وصحيح.
      #
      # الحل: بدل sed اللي ممكن يكرر الـ imports، نقرأ الملف الأصلي ونكتبه من الصفر بشكل آمن.
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="gen/android/app/build.gradle.kts"

          if ! grep -q "keystore.properties" "$GRADLE_FILE"; then
            # إضافة import java.io.FileInputStream لو مش موجود (java.util.Properties موجود أصلاً من Tauri)
            if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
              sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
            fi

            # إضافة import java.util.Properties بس لو مش موجود أصلاً
            if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
              sed -i '1i import java.util.Properties' "$GRADLE_FILE"
            fi

            # إضافة تحميل keystoreProperties قبل بلوك android {
            sed -i '/^android {/i \
          val keystorePropertiesFile = rootProject.file("keystore.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' "$GRADLE_FILE"

            # إضافة signingConfigs جوه بلوك android { بعد أول سطر مباشرة
            sed -i '/^android {/a \
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String\
                      keyPassword = keystoreProperties["password"] as String\
                      storeFile = file(keystoreProperties["storeFile"] as String)\
                      storePassword = keystoreProperties["password"] as String\
                  }\
              }\
          ' "$GRADLE_FILE"

            # ربط signingConfig بـ buildTypes.release
            sed -i '/getByName("release")/a \
                  signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
          fi

          cat "$GRADLE_FILE"

      # من غير --target: Tauri بيبني ملف APK واحد شامل كل المعماريات جواه
      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk

      # تنظيف الملفات الحساسة فورًا بعد البناء
      - name: Cleanup Keystore
        if: always()
        run: rm -f naqrah-release.keystore gen/android/keystore.properties

      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*universal*release*.apk" ! -name "*unsigned*" -exec cp {} Naqrah-Android.apk \;
          if [ ! -f Naqrah-Android.apk ]; then
            echo "::error::لم يتم إيجاد APK عام موقّع! تأكد من صحة الـ signing config."
            find gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android-universal
          path: Naqrah-Android.apk

  # كل معمارية ليها VM منفصلة وبتبني APK خاص بيها بس (مش universal).
  # ده بيدي 4 ملفات APK صغيرة ومتوقعة زي الأصلية، كل واحد لمعماريته.
  build-android:
    name: Build Android APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - arch: armeabi-v7a          # أندرويد 6 (API 23) فما فوق
            rust_target: armv7-linux-androideabi
            tauri_target: armv7
          - arch: x86
            rust_target: i686-linux-android
            tauri_target: i686
          - arch: x86_64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      # نجيب Rust target بتاع المعمارية دي بس (مش الأربعة) عشان يبقى أسرع
      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.arch }}

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ matrix.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # كاش مجلد gen/android لتفادي إعادة تهيئة مشروع الأندرويد بالكامل كل مرة
      # v2: cache key متغير عشان نتخلص من أي نسخة مكسورة محفوظة سابقاً
      # كل معمارية ليها كاش منفصل عشان الـ 4 VMs بيشتغلوا في نفس الوقت
      - name: Cache Android project
        uses: actions/cache@v4
        with:
          path: gen/android
          key: android-gen-v2-${{ matrix.arch }}-${{ hashFiles('tauri.conf.json') }}

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.nagrah"/g' tauri.conf.json
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      # نولّد أيقونات كل المنصات (بما فيها أندرويد) من نفس ملف iconn.png
      # عشان أيقونة الـ APK تطابق أيقونة سطح المكتب. لازم تتنفذ بعد تهيئة
      # مجلد gen/android (سواء جديد أو مسترجع من الكاش) عشان تلاقي المسار
      # الصحيح وتحدّث الـ mipmap resources بتاعته.
      - name: Regenerate Icons (sync with iconn.png)
        run: cargo tauri icon iconn.png

      # فك تشفير الـ keystore من السيكرت وحفظه كملف مؤقت للتوقيع
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > naqrah-release.keystore

      # ملف الإعدادات اللي Gradle هيقرأه (بعد ما نربطه بـ build.gradle.kts في الخطوة الجاية)
      - name: Create Signing Properties
        run: |
          cat > gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/naqrah-release.keystore
          EOF

      # الخطوة الحاسمة: Tauri Android CLI مبيربطش keystore.properties بالـ signing تلقائيًا.
      # لازم نضيف signingConfigs في build.gradle.kts يدويًا ونربطها بـ buildTypes.release،
      # وإلا الـ APK هيتبني "unsigned" حتى لو keystore.properties موجود وصحيح.
      #
      # الحل: بدل sed اللي ممكن يكرر الـ imports، نقرأ الملف الأصلي ونكتبه من الصفر بشكل آمن.
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="gen/android/app/build.gradle.kts"

          if ! grep -q "keystore.properties" "$GRADLE_FILE"; then
            # إضافة import java.io.FileInputStream لو مش موجود (java.util.Properties موجود أصلاً من Tauri)
            if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
              sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
            fi

            # إضافة import java.util.Properties بس لو مش موجود أصلاً
            if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
              sed -i '1i import java.util.Properties' "$GRADLE_FILE"
            fi

            # إضافة تحميل keystoreProperties قبل بلوك android {
            sed -i '/^android {/i \
          val keystorePropertiesFile = rootProject.file("keystore.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' "$GRADLE_FILE"

            # إضافة signingConfigs جوه بلوك android { بعد أول سطر مباشرة
            sed -i '/^android {/a \
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String\
                      keyPassword = keystoreProperties["password"] as String\
                      storeFile = file(keystoreProperties["storeFile"] as String)\
                      storePassword = keystoreProperties["password"] as String\
                  }\
              }\
          ' "$GRADLE_FILE"

            # ربط signingConfig بـ buildTypes.release
            sed -i '/getByName("release")/a \
                  signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
          fi

          cat "$GRADLE_FILE"

      # --target هنا بيخلي Tauri يبني معمارية واحدة بس (بتاعة الـ matrix الحالية)
      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk --target ${{ matrix.tauri_target }}

      # تنظيف الملفات الحساسة فورًا بعد البناء
      - name: Cleanup Keystore
        if: always()
        run: rm -f naqrah-release.keystore gen/android/keystore.properties

      # اسم الملف بيتحط فيه اسم المعمارية عشان يبقى واضح للمستخدم وهو بيحمّل
      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*release*.apk" ! -name "*unsigned*" -exec cp {} Naqrah-Android-${{ matrix.arch }}.apk \;
          if [ ! -f "Naqrah-Android-${{ matrix.arch }}.apk" ]; then
            echo "::error::لم يتم إيجاد APK موقّع لمعمارية ${{ matrix.arch }}! تأكد من صحة الـ signing config."
            find gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android-${{ matrix.arch }}
          path: Naqrah-Android-${{ matrix.arch }}.apk

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-arch, build-void, build-alpine, build-android-universal, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # بيبني جدول تحميل زي البرامج الكبيرة، فيه المنصة والمعمارية والحجم ورابط
      # مباشر لكل ملف، ويتحط كـ body للـ Release
      - name: Generate Download Table
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          {
            echo "## 📦 Naqrah ${TAG}"
            echo ""
            echo "اختر النسخة المناسبة لجهازك من الجدول تحت وحمّلها مباشرة 👇"
            echo ""
            echo "| 💻 المنصة | 🏗️ المعمارية | 📁 الحجم | ⬇️ التحميل |"
            echo "|:---|:---|:---:|:---:|"

            for f in artifacts/*; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1 | sed 's/[[:space:]]*//g')
              url="${BASE_URL}/${name}"

              case "$name" in
                *Windows*)
                  echo "| 🪟 **Windows** | x86_64 | ${size} | [تحميل](${url}) |" ;;
                *Linux*.deb)
                  echo "| 🐧 **Linux (Debian/Ubuntu)** | x86_64 — .deb | ${size} | [تحميل](${url}) |" ;;
                *Linux*.rpm)
                  echo "| 🐧 **Linux (Fedora/RHEL)** | x86_64 — .rpm | ${size} | [تحميل](${url}) |" ;;
                *Linux*.pkg.tar.zst)
                  echo "| 🐧 **Linux (Arch)** | x86_64 — .pkg.tar.zst | ${size} | [تحميل](${url}) |" ;;
                *Void*.xbps)
                  echo "| 🐧 **Linux (Void)** | x86_64 glibc — .xbps | ${size} | [تحميل](${url}) |" ;;
                naqrah-elf-glibc)
                  echo "| 🐧 **Linux (glibc)** | x86_64 — ملف تنفيذي مباشر | ${size} | [تحميل](${url}) |" ;;
                naqrah-elf-musllibc)
                  echo "| 🐧 **Alpine Linux (musl)** | x86_64 — ملف تنفيذي مباشر | ${size} | [تحميل](${url}) |" ;;
                Naqrah-Android.apk)
                  echo "| 🤖 **Android** | 🌐 عام — يشتغل على أي جهاز | ${size} | [تحميل](${url}) |" ;;
                *arm64-v8a*)
                  echo "| 🤖 **Android** | ARM64 (v8a) — الأجهزة الحديثة | ${size} | [تحميل](${url}) |" ;;
                *armeabi-v7a*)
                  echo "| 🤖 **Android** | ARMv7 (v7a) — أندرويد 6 فما فوق | ${size} | [تحميل](${url}) |" ;;
                *x86_64*)
                  echo "| 🤖 **Android** | x86_64 — أجهزة المحاكاة/الإنتل | ${size} | [تحميل](${url}) |" ;;
                *x86*)
                  echo "| 🤖 **Android** | x86 — أجهزة المحاكاة/الإنتل | ${size} | [تحميل](${url}) |" ;;
                *)
                  echo "| 📦 **أخرى** | - | ${size} | [تحميل](${url}) |" ;;
              esac
            done

            echo ""
            echo "> 🐧 **مستخدم لينكس؟** حمّل حزمة توزيعتك (.deb لـ Debian/Ubuntu، .rpm لـ Fedora، .pkg.tar.zst لـ Arch، .xbps لـ Void) أو الملف التنفيذي المباشر (ELF)."
            echo ""
            echo "> 💡 **مش عارف تختار؟** جرّب نسخة **arm64-v8a** لو موبايلك حديث (2018 فما فوق)، أو حمّل النسخة **العامة (Universal)** لو مش عارف معماريتك وعايز خيار آمن يشتغل على أي جهاز."
            echo ""
            echo "---"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}