name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Naqrah-Linux
          - os: windows-latest
            artifact: Naqrah-Windows

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إعداد بيئة لينكس (Tauri dependencies + UPX)
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf upx-ucl

      # 2. إعداد بيئة ويندوز (UPX)
      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # كاش لمكتبات Rust يسرّع البناء التالي بشكل كبير
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-desktop

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # 3. بناء تطبيق سطح المكتب
      - name: Build Tauri App
        run: cargo tauri build

      # 4. ضغط الملفات التنفيذية لأقصى درجة (Extreme Compression)
      - name: Compress Linux Binary
        if: runner.os == 'Linux'
        run: upx --best --lzma target/release/naqrah || true

      - name: Compress Windows Binary
        if: runner.os == 'Windows'
        run: upx --best --lzma target/release/naqrah.exe || true

      # 5. التغليف والتجهيز للرفع
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir Naqrah-Linux
          cp target/release/naqrah Naqrah-Linux/
          tar -czvf Naqrah-Linux.tar.gz Naqrah-Linux

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Naqrah-Windows
          Copy-Item target\release\naqrah.exe -Destination Naqrah-Windows\
          Compress-Archive -Path Naqrah-Windows -DestinationPath Naqrah-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.nagrah"/g' tauri.conf.json
          cargo tauri android init

      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk

      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} Naqrah-Android.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android
          path: Naqrah-Android.apk

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}