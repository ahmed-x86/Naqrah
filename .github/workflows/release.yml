name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_CLI_VERSION: "2.0.0"

jobs:
  # ===== لينكس (glibc) - المرحلة السريعة: باينري ELF فقط، بدون تغليف =====
  # الهدف: إنتاج naqrah-elf-glibc بأسرع وقت ممكن، عشان build-arch و build-void
  # يقدروا يبدأوا فور جاهزيته، من غير ما ينتظروا تغليف deb/rpm (build-linux-packages)
  # ولا بناء ويندوز (build-windows) اللي كانوا سابقًا جزء من نفس الـ matrix job.
  build-linux-elf:
    name: Build Linux ELF (glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf upx-ucl

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # كاش لمكتبات ومشروع Rust (target/, registry)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-desktop

      # كاش binary أداة tauri-cli نفسها. المفتاح هنا لازم يتطابق بالظبط بين
      # خطوة "Cache" وخطوة "Install" عشان cache-hit يشتغل صح.
      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # --no-bundle: هنا نحتاج الباينري الخام بس، تغليف deb/rpm بيصير لاحقًا
      # في build-linux-packages، عشان هذا الـ job يفضل أسرع ما يمكن
      - name: Build Tauri App
        run: cargo tauri build --no-bundle

      # بناء AppImage (glibc x86_64 بس - مفيش AppImage لـ musl أصلاً).
      # بنعملها هنا جوه نفس الجوب مباشرة بعد البناء، عشان AppImage مش مجرد
      # تغليف باينري زي deb/rpm - محتاجة tauri-cli نفسه يجمع الأيقونات
      # والمكتبات و.desktop. لأن الكود متبني بالفعل، cargo build هنا هيكون
      # فوري (incremental) وهيكمل على طول لمرحلة التغليف، فمش محتاجين جوب
      # منفصل يعيد بناء المشروع من الصفر زي ما كان هيحصل لو فصلناها.
      # لازم قبل خطوة الـ upx عشان الـ AppImage تاخد نسخة الباينري النضيفة.
      - name: Build AppImage
        env:
          # يشغل appimagetool/linuxdeploy بدون FUSE، لأن runners أوبونتو
          # الحديثة مبيجيش فيها libfuse2 افتراضيًا وده بيفشّل بناء AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles appimage

      - name: Locate and Rename AppImage
        run: |
          APPIMAGE_FILE=$(find target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          cp "$APPIMAGE_FILE" Naqrah-Linux-glibc.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-AppImage
          path: Naqrah-Linux-glibc.AppImage

      # ضغط الملف التنفيذي لأقصى درجة (Extreme Compression)
      - name: Compress Linux Binary
        run: upx --best --lzma target/release/naqrah || true

      # رفع ملف ELF مباشرة بدون أي تغليف إضافي وتسميته naqrah-elf-glibc (لباقي التوزيعات)
      - name: Prepare Linux ELF Binary
        run: cp target/release/naqrah naqrah-elf-glibc

      - name: Upload Linux ELF Binary
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: naqrah-elf-glibc

  # ===== لينكس (glibc) - arm64 - بناء فقط (بدون تغليف) =====
  # زي build-linux-elf بالظبط بس على معمارية arm64، باستخدام الـ runner
  # الرسمي من GitHub (ubuntu-24.04-arm) بدل إعداد QEMU/Docker.
  # ملحوظة: مفاتيح الكاش (rust-cache و tauri-cli) لازم تكون مختلفة عن
  # نسخة x86_64 عشان ما يحصلش تصادم بين باينري/كاش المعماريتين
  # (runner.os بيرجع "Linux" في الحالتين، فمضفنا runner.arch للتفرقة).
  build-linux-elf-arm64:
    name: Build Linux ELF (glibc, arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf upx-ucl

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # كاش لمكتبات ومشروع Rust (target/, registry)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-arm-desktop

      # كاش binary أداة tauri-cli نفسها. المفتاح هنا لازم يتطابق بالظبط بين
      # خطوة "Cache" وخطوة "Install" عشان cache-hit يشتغل صح.
      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # --no-bundle: نفس فلسفة نسخة x86_64، باينري خام بس بدون أي تغليف
      - name: Build Tauri App
        run: cargo tauri build --no-bundle

      # ضغط الملف التنفيذي لأقصى درجة (Extreme Compression)
      - name: Compress Linux Binary
        run: upx --best --lzma target/release/naqrah || true

      # رفع ملف ELF مباشرة بدون أي تغليف إضافي وتسميته naqrah-elf-glibc-arm64
      - name: Prepare Linux ELF Binary
        run: cp target/release/naqrah naqrah-elf-glibc-arm64

      - name: Upload Linux ELF Binary
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF-arm64
          path: naqrah-elf-glibc-arm64

  # ===== FreeBSD (x86_64) - باينري ELF فقط، بدون تغليف =====
  # جيت-هَب مبيوفرش رانرز FreeBSD أصلاً (بس Ubuntu/Windows/macOS)، فبنستخدم
  # vmactions/freebsd-vm اللي بيشغّل VM حقيقي بمعمارية FreeBSD جوه رانر
  # ubuntu-latest عادي (عن طريق QEMU). الكود بيتعمله sync تلقائي جوه الـ VM،
  # والملفات الناتجة (زي الباينري) بترجع تلقائيًا لمجلد الشغل على الهوست
  # بعد ما الخطوة تخلص (copyback: true)، عشان نقدر نرفعها بـ upload-artifact
  # عادي بعد كده.
  build-freebsd-elf:
    name: Build FreeBSD ELF (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          copyback: true
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD: { url: "pkg+http://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            # لو نسخة الـ VM لسه أقدم من الحزم على "latest" (بيحصل لما FreeBSD
            # تصدّر نسخة نقطية جديدة وريبو latest يتحدث قبل ما صورة الـ action
            # تتحدث)، ده بيمنع pkg إنه يرفض التحديث بسبب فحص ABI الصارم.
            export IGNORE_OSVERSION=yes
            export ASSUME_ALWAYS_YES=yes
            pkg update -f
            
            echo "=== Available WebKit Packages ==="
            pkg search webkit | grep gtk || true
            echo "================================="
            
            # bzip2 موجودة في نظام FreeBSD الأساسي كمكتبة، لكن باكدج
            # archivers/bzip2 نفسها (اللي بنثبتها من pkg) للأسف مفيهاش ملف
            # bzip2.pc خالص (اتأكدنا من pkg-plist الرسمي بتاعها) - يعني تثبيت
            # الباكدج وحده مش هيحل المشكلة. و freetype2 (اللي gdk-3.0 بيعتمد
            # عليها) بيحط "bzip2" في Requires.private بتاعته، فـ pkg-config
            # بيفشل تمامًا وهو بيحاول يحل شجرة الاعتماديات، حتى لو إحنا
            # طالبين cflags/libs بتاعة gdk-3.0 بس. الحل: نفتعل ملف bzip2.pc
            # بسيط يدويًا يأشر على libbz2 اللي فعلاً موجودة بعد تثبيت الباكدج.
            pkg install -y rust pkgconf gtk3 librsvg2 patchelf bzip2

            install -d /usr/local/libdata/pkgconfig
            cat > /usr/local/libdata/pkgconfig/bzip2.pc << 'EOF'
            prefix=/usr/local
            exec_prefix=${prefix}
            libdir=${exec_prefix}/lib
            includedir=${prefix}/include

            Name: bzip2
            Description: bzip2 compression library
            Version: 1.0.8
            Libs: -L${libdir} -lbz2
            Cflags: -I${includedir}
            EOF

            # فحص سريع يفشل هنا في prepare لو الملف غلط، بدل ما يفشل بعد
            # نص ساعة بناء جوه cargo build.
            pkg-config --exists bzip2 && echo "bzip2.pc OK: $(pkg-config --modversion bzip2)"

            # أسماء باكدجات WebKit على FreeBSD فيها underscore قبل رقم النسخة
            # (webkit2-gtk_41 مش webkit2-gtk41)، عكس Ubuntu/Debian تماماً
            pkg install -y webkit2-gtk_41 || pkg install -y webkit2-gtk_40 || pkg install -y webkit2-gtk_60

            pkg-config --cflags --libs gdk-3.0
          # استخدمنا "cargo build" مباشرة بدل "cargo tauri build --no-bundle".
          # السبب: tauri-cli بيعتمد داخليًا على مكتبة cargo-mobile2 (لدعم
          # أندرويد/iOS)، وهي رسميًا مش بتدعم FreeBSD كنظام مضيف (host) خالص -
          # فيه compile_error!() صريح جواها لأي نظام غير مدعوم، فتثبيت
          # tauri-cli نفسه مستحيل ينجح على FreeBSD مهما كانت الباكدجات سليمة.
          # بما إننا أصلاً --no-bundle (باينري خام من غير تغليف)، مش محتاجين
          # الـ CLI خالص؛ مكتبة tauri (عبر build.rs) كفاية لبناء الباينري.
          run: |
            export PKG_CONFIG_PATH="/usr/local/libdata/pkgconfig:/usr/libdata/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            cargo build --release
            cp target/release/naqrah naqrah-elf-freebsd-x86_64

      - name: Upload FreeBSD ELF Binary
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-FreeBSD-ELF
          path: naqrah-elf-freebsd-x86_64

  # ===== لينكس (glibc, arm64) - تغليف .deb و .rpm =====
  # نفس أسلوب نسخة x86_64 بالظبط: جوب مستقل بياخد الباينري الجاهز من
  # build-linux-elf-arm64 بس ويغلفه، من غير ما يعيد بناء المشروع.
  # شغال على runner من نوع aarch64 حقيقي (ubuntu-24.04-arm) عشان
  # rpmbuild/dpkg-deb يشتغلوا native على نفس معمارية الباينري.
  build-linux-packages-arm64:
    name: Build Linux Packages (.deb / .rpm — arm64)
    needs: build-linux-elf-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux ELF Binary (arm64)
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-arm64
          path: elf-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp elf-src/naqrah-elf-glibc-arm64 naqrah-bin
          chmod +x naqrah-bin

      # بناء حزمة .deb (Debian / Ubuntu) - arm64
      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/naqrah_1.0.0_arm64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp naqrah-bin "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: naqrah
          Version: 1.0.0
          Architecture: arm64
          Maintainer: ahmed-x86
          Description: Naqrah - Arabic text diacritics (Tashkeel) editor
           محرر تشكيل النصوص العربية بواجهة رسومية حديثة
          Section: utils
          Priority: optional
          EOF

          # إزالة المسافات البادئة من ملف control (heredoc بيضيف مسافات)
          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb Naqrah-Linux-arm64.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-arm64-deb
          path: Naqrah-Linux-arm64.deb

      # بناء حزمة .rpm (Fedora / RHEL / openSUSE) - aarch64
      - name: Build .rpm Package
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}

          # تجهيز الملفات المصدرية
          mkdir -p rpmbuild/SOURCES/naqrah-1.0.0
          cp naqrah-bin rpmbuild/SOURCES/naqrah-1.0.0/naqrah
          cp naqrah.desktop rpmbuild/SOURCES/naqrah-1.0.0/
          cp iconn.png rpmbuild/SOURCES/naqrah-1.0.0/naqrah.png
          tar -czf rpmbuild/SOURCES/naqrah-1.0.0.tar.gz -C rpmbuild/SOURCES naqrah-1.0.0

          cat > rpmbuild/SPECS/naqrah.spec <<'SPEC'
          Name:           naqrah
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Arabic text diacritics (Tashkeel) editor
          License:        GPL
          Source0:        naqrah-1.0.0.tar.gz

          %description
          Naqrah - محرر تشكيل النصوص العربية بواجهة رسومية حديثة

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp naqrah %{buildroot}/usr/bin/
          cp naqrah.desktop %{buildroot}/usr/share/applications/
          cp naqrah.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/

          %files
          /usr/bin/naqrah
          /usr/share/applications/naqrah.desktop
          /usr/share/icons/hicolor/256x256/apps/naqrah.png
          SPEC

          # إزالة المسافات البادئة
          sed -i 's/^          //' rpmbuild/SPECS/naqrah.spec

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/naqrah.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} Naqrah-Linux-arm64.rpm \;

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-arm64-rpm
          path: Naqrah-Linux-arm64.rpm

  # ===== لينكس (glibc) - تغليف .deb و .rpm =====
  # يعتمد بس على الباينري الجاهز من build-linux-elf (مش على إعادة بناء المشروع)
  build-linux-packages:
    name: Build Linux Packages (.deb / .rpm)
    needs: build-linux-elf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux ELF Binary
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: elf-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp elf-src/naqrah-elf-glibc naqrah-bin
          chmod +x naqrah-bin

      # بناء حزمة .deb (Debian / Ubuntu)
      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/naqrah_1.0.0_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp naqrah-bin "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: naqrah
          Version: 1.0.0
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: Naqrah - Arabic text diacritics (Tashkeel) editor
           محرر تشكيل النصوص العربية بواجهة رسومية حديثة
          Section: utils
          Priority: optional
          EOF

          # إزالة المسافات البادئة من ملف control (heredoc بيضيف مسافات)
          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb Naqrah-Linux.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-deb
          path: Naqrah-Linux.deb

      # بناء حزمة .rpm (Fedora / RHEL / openSUSE)
      - name: Build .rpm Package
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}

          # تجهيز الملفات المصدرية
          mkdir -p rpmbuild/SOURCES/naqrah-1.0.0
          cp naqrah-bin rpmbuild/SOURCES/naqrah-1.0.0/naqrah
          cp naqrah.desktop rpmbuild/SOURCES/naqrah-1.0.0/
          cp iconn.png rpmbuild/SOURCES/naqrah-1.0.0/naqrah.png
          tar -czf rpmbuild/SOURCES/naqrah-1.0.0.tar.gz -C rpmbuild/SOURCES naqrah-1.0.0

          cat > rpmbuild/SPECS/naqrah.spec <<'SPEC'
          Name:           naqrah
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Arabic text diacritics (Tashkeel) editor
          License:        GPL
          Source0:        naqrah-1.0.0.tar.gz

          %description
          Naqrah - محرر تشكيل النصوص العربية بواجهة رسومية حديثة

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp naqrah %{buildroot}/usr/bin/
          cp naqrah.desktop %{buildroot}/usr/share/applications/
          cp naqrah.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/

          %files
          /usr/bin/naqrah
          /usr/share/applications/naqrah.desktop
          /usr/share/icons/hicolor/256x256/apps/naqrah.png
          SPEC

          # إزالة المسافات البادئة
          sed -i 's/^          //' rpmbuild/SPECS/naqrah.spec

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/naqrah.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} Naqrah-Linux.rpm \;

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-rpm
          path: Naqrah-Linux.rpm

  # ===== لينكس (musl) - تغليف .deb و .rpم بنفس أسلوب نسخة glibc بالظبط =====
  # ملاحظة: دي تغليف بسيط للباينري الجاهز، مش تحقق من التوافق مع كل توزيعة
  build-linux-packages-musl:
    name: Build Linux Packages (.deb / .rpm — musl)
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl ELF Binary
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: elf-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp elf-src/naqrah-elf-musllibc naqrah-bin
          chmod +x naqrah-bin

      # بناء حزمة .deb من باينري musl
      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/naqrah_1.0.0_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp naqrah-bin "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: naqrah
          Version: 1.0.0
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: Naqrah - Arabic text diacritics (Tashkeel) editor (musl build)
