name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_CLI_VERSION: "2.0.0"

jobs:
  # ===== لينكس (glibc) - المرحلة السريعة: باينري ELF فقط، بدون تغليف =====
  # الهدف: إنتاج naqrah-elf-glibc بأسرع وقت ممكن، عشان build-arch و build-void
  # يقدروا يبدأوا فور جاهزيته، من غير ما ينتظروا تغليف deb/rpm (build-linux-packages)
  # ولا بناء ويندوز (build-windows) اللي كانوا سابقًا جزء من نفس الـ matrix job.
  build-linux-elf:
    name: Build Linux ELF (glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf upx-ucl

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # كاش لمكتبات ومشروع Rust (target/, registry)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-desktop

      # كاش binary أداة tauri-cli نفسها. المفتاح هنا لازم يتطابق بالظبط بين
      # خطوة "Cache" وخطوة "Install" عشان cache-hit يشتغل صح.
      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # --no-bundle: هنا نحتاج الباينري الخام بس، تغليف deb/rpm بيصير لاحقًا
      # في build-linux-packages، عشان هذا الـ job يفضل أسرع ما يمكن
      - name: Build Tauri App
        run: cargo tauri build --no-bundle

      # ضغط الملف التنفيذي لأقصى درجة (Extreme Compression)
      - name: Compress Linux Binary
        run: upx --best --lzma target/release/naqrah || true

      # رفع ملف ELF مباشرة بدون أي تغليف إضافي وتسميته naqrah-elf-glibc (لباقي التوزيعات)
      - name: Prepare Linux ELF Binary
        run: cp target/release/naqrah naqrah-elf-glibc

      - name: Upload Linux ELF Binary
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: naqrah-elf-glibc

  # ===== لينكس (glibc) - تغليف .deb و .rpm =====
  # يعتمد بس على الباينري الجاهز من build-linux-elf (مش على إعادة بناء المشروع)
  build-linux-packages:
    name: Build Linux Packages (.deb / .rpm)
    needs: build-linux-elf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux ELF Binary
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: elf-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp elf-src/naqrah-elf-glibc naqrah-bin
          chmod +x naqrah-bin

      # بناء حزمة .deb (Debian / Ubuntu)
      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/naqrah_1.0.0_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp naqrah-bin "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: naqrah
          Version: 1.0.0
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: Naqrah - Arabic text diacritics (Tashkeel) editor
           محرر تشكيل النصوص العربية بواجهة رسومية حديثة
          Section: utils
          Priority: optional
          EOF

          # إزالة المسافات البادئة من ملف control (heredoc بيضيف مسافات)
          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb Naqrah-Linux.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-deb
          path: Naqrah-Linux.deb

      # بناء حزمة .rpm (Fedora / RHEL / openSUSE)
      - name: Build .rpm Package
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}

          # تجهيز الملفات المصدرية
          mkdir -p rpmbuild/SOURCES/naqrah-1.0.0
          cp naqrah-bin rpmbuild/SOURCES/naqrah-1.0.0/naqrah
          cp naqrah.desktop rpmbuild/SOURCES/naqrah-1.0.0/
          cp iconn.png rpmbuild/SOURCES/naqrah-1.0.0/naqrah.png
          tar -czf rpmbuild/SOURCES/naqrah-1.0.0.tar.gz -C rpmbuild/SOURCES naqrah-1.0.0

          cat > rpmbuild/SPECS/naqrah.spec <<'SPEC'
          Name:           naqrah
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Arabic text diacritics (Tashkeel) editor
          License:        GPL
          Source0:        naqrah-1.0.0.tar.gz

          %description
          Naqrah - محرر تشكيل النصوص العربية بواجهة رسومية حديثة

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp naqrah %{buildroot}/usr/bin/
          cp naqrah.desktop %{buildroot}/usr/share/applications/
          cp naqrah.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/

          %files
          /usr/bin/naqrah
          /usr/share/applications/naqrah.desktop
          /usr/share/icons/hicolor/256x256/apps/naqrah.png
          SPEC

          # إزالة المسافات البادئة
          sed -i 's/^          //' rpmbuild/SPECS/naqrah.spec

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/naqrah.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} Naqrah-Linux.rpm \;

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-rpm
          path: Naqrah-Linux.rpm

  # ===== لينكس (musl) - تغليف .deb و .rpم بنفس أسلوب نسخة glibc بالظبط =====
  # ملاحظة: دي تغليف بسيط للباينري الجاهز، مش تحقق من التوافق مع كل توزيعة
  build-linux-packages-musl:
    name: Build Linux Packages (.deb / .rpm — musl)
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl ELF Binary
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: elf-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp elf-src/naqrah-elf-musllibc naqrah-bin
          chmod +x naqrah-bin

      # بناء حزمة .deb من باينري musl
      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/naqrah_1.0.0_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp naqrah-bin "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: naqrah
          Version: 1.0.0
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: Naqrah - Arabic text diacritics (Tashkeel) editor (musl build)
           محرر تشكيل النصوص العربية بواجهة رسومية حديثة
          Section: utils
          Priority: optional
          EOF

          # إزالة المسافات البادئة من ملف control (heredoc بيضيف مسافات)
          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb Naqrah-Linux-musl.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-musl-deb
          path: Naqrah-Linux-musl.deb

      # بناء حزمة .rpm من باينري musl
      - name: Build .rpm Package
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}

          # تجهيز الملفات المصدرية
          mkdir -p rpmbuild/SOURCES/naqrah-1.0.0
          cp naqrah-bin rpmbuild/SOURCES/naqrah-1.0.0/naqrah
          cp naqrah.desktop rpmbuild/SOURCES/naqrah-1.0.0/
          cp iconn.png rpmbuild/SOURCES/naqrah-1.0.0/naqrah.png
          tar -czf rpmbuild/SOURCES/naqrah-1.0.0.tar.gz -C rpmbuild/SOURCES naqrah-1.0.0

          cat > rpmbuild/SPECS/naqrah.spec <<'SPEC'
          Name:           naqrah
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Arabic text diacritics (Tashkeel) editor (musl build)
          License:        GPL
          Source0:        naqrah-1.0.0.tar.gz

          %description
          Naqrah - محرر تشكيل النصوص العربية بواجهة رسومية حديثة

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp naqrah %{buildroot}/usr/bin/
          cp naqrah.desktop %{buildroot}/usr/share/applications/
          cp naqrah.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/

          %files
          /usr/bin/naqrah
          /usr/share/applications/naqrah.desktop
          /usr/share/icons/hicolor/256x256/apps/naqrah.png
          SPEC

          # إزالة المسافات البادئة
          sed -i 's/^          //' rpmbuild/SPECS/naqrah.spec

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/naqrah.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} Naqrah-Linux-musl.rpm \;

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-musl-rpm
          path: Naqrah-Linux-musl.rpm

  # ===== ويندوز - مستقل تمامًا عن سلسلة اللينكس (glibc/musl) =====
  build-windows:
    name: Build on windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install UPX (Windows)
        run: choco install upx

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-latest-desktop

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-bin-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri App
        run: cargo tauri build

      - name: Compress Windows Binary
        run: upx --best --lzma target/release/naqrah.exe || true

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Naqrah-Windows
          Copy-Item target\release\naqrah.exe -Destination Naqrah-Windows\
          Copy-Item icon.ico -Destination Naqrah-Windows\
          Compress-Archive -Path Naqrah-Windows -DestinationPath Naqrah-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Windows
          path: Naqrah-Windows.zip

  # ===== Alpine (musl) - المرحلة السريعة: باينري ELF فقط، بدون تغليف .apk =====
  # الهدف: إنتاج naqrah-elf-musllibc بأسرع وقت ممكن عشان build-void يقدر يبدأ
  # فورًا، من غير ما ينتظر تغليف .apk بأداة abuild (build-alpine-apk).
  build-alpine-elf:
    name: Build Alpine ELF (musl libc)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apk update
          apk add --no-cache build-base rust cargo git pkgconf \
            webkit2gtk-4.1-dev gtk+3.0-dev librsvg-dev patchelf upx \
            libayatana-appindicator-dev dbus-dev openssl-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri Binary
        run: cargo tauri build --no-bundle

      - name: Compress Binary
        run: upx --best --lzma target/release/naqrah || true

      - name: Prepare musl ELF Binary
        run: cp target/release/naqrah naqrah-elf-musllibc

      - name: Upload Alpine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: naqrah-elf-musllibc

  # ===== Alpine (musl) - تغليف حزمة .apk رسمية بأداة abuild =====
  # يعتمد بس على الباينري الجاهز من build-alpine-elf (مش على إعادة بناء المشروع)
  build-alpine-apk:
    name: Build Alpine .apk Package
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl ELF Binary
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: elf-src

      # apk update ضروري هنا: بدونه ما يكون عندنا فهرس محلي للمستودعات،
      # فـ abuild يفشل في حل الاعتماديات المذكورة في APKBUILD (depends=...)
      # حتى لو الحزم موجودة فعليًا في مستودعات Alpine
      - name: Install abuild Tooling
        run: |
          apk update
          apk add --no-cache alpine-sdk sudo

      - name: Create Non-root Build User
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate abuild Signing Key
        run: su builder -c "abuild-keygen -a -i -n"

      - name: Prepare APKBUILD Sources
        run: |
          mkdir -p apk-pkg
          cp elf-src/naqrah-elf-musllibc apk-pkg/naqrah
          cp naqrah.desktop apk-pkg/naqrah.desktop
          cp iconn.png apk-pkg/naqrah.png

          cat > apk-pkg/APKBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=0
          pkgdesc="Arabic text diacritics (Tashkeel) editor - محرر تشكيل النصوص العربية"
          url="https://github.com/ahmed-x86/Naqrah"
          arch="x86_64"
          license="GPL"
          depends="webkit2gtk-4.1 gtk+3.0 librsvg libayatana-appindicator dbus"
          options="!strip !check"
          source="naqrah naqrah.desktop naqrah.png"

          package() {
              install -Dm755 "$srcdir"/naqrah "$pkgdir"/usr/bin/naqrah
              install -Dm644 "$srcdir"/naqrah.desktop "$pkgdir"/usr/share/applications/naqrah.desktop
              install -Dm644 "$srcdir"/naqrah.png "$pkgdir"/usr/share/icons/hicolor/256x256/apps/naqrah.png
          }
          EOF
          sed -i 's/^          //' apk-pkg/APKBUILD

      - name: Build .apk Package with abuild
        run: |
          chmod +x apk-pkg/naqrah
          chown -R builder:builder apk-pkg
          cd apk-pkg
          su builder -c "cd \$(pwd) && abuild checksum && abuild -r"
          find ~builder/packages -name "*.apk" -exec cp {} ../Naqrah-Alpine.apk \;

      - name: Upload Alpine .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Alpine-apk
          path: Naqrah-Alpine.apk

  # ===== تغليف حزمة Arch Linux (بدون بناء) =====
  # بيستنى الباينري الجاهز من build-linux-elf بس (مش تغليف deb/rpm ولا ويندوز)
  build-arch:
    name: Build Arch Package (PKGBUILD)
    needs: build-linux-elf
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download glibc Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: elf-src

      - name: Install Packaging Dependencies
        run: pacman -Syu --noconfirm --needed sudo

      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp elf-src/naqrah-elf-glibc arch-pkg/naqrah
          chmod +x arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor - محرر تشكيل النصوص العربية"
          arch=('x86_64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-x86_64.pkg.tar.zst ../Naqrah-Linux.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-pkg
          path: Naqrah-Linux.pkg.tar.zst

  # ===== تغليف باينري musl كحزمة Arch (.pkg.tar.zst) - نفس أسلوب نسخة glibc بالظبط =====
  # ملاحظة: دي تغليف بسيط للباينري الجاهز، مش تحقق من التوافق مع كل توزيعة
  build-arch-musl:
    name: Build Arch Package (PKGBUILD — musl)
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: elf-src

      - name: Install Packaging Dependencies
        run: pacman -Syu --noconfirm --needed sudo

      - name: Create Non-root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD Sources
        run: |
          mkdir -p arch-pkg
          cp elf-src/naqrah-elf-musllibc arch-pkg/naqrah
          chmod +x arch-pkg/naqrah
          cp naqrah.desktop arch-pkg/naqrah.desktop
          cp iconn.png arch-pkg/naqrah.png

          cat > arch-pkg/PKGBUILD <<'EOF'
          pkgname=naqrah
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Arabic text diacritics (Tashkeel) editor (musl build) - محرر تشكيل النصوص العربية"
          arch=('x86_64')
          url="https://github.com/ahmed-x86/Naqrah"
          license=('GPL')
          depends=('webkit2gtk-4.1' 'gtk3')
          source=("naqrah" "naqrah.desktop" "naqrah.png")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "${srcdir}/naqrah" "${pkgdir}/usr/bin/naqrah"
              install -Dm644 "${srcdir}/naqrah.desktop" "${pkgdir}/usr/share/applications/naqrah.desktop"
              install -Dm644 "${srcdir}/naqrah.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/naqrah.png"
          }
          EOF
          sed -i 's/^          //' arch-pkg/PKGBUILD

      - name: Build Package with makepkg -s
        run: |
          chown -R builder:builder arch-pkg
          cd arch-pkg
          su builder -c "makepkg -s --noconfirm"
          mv naqrah-1.0.0-1-x86_64.pkg.tar.zst ../Naqrah-Linux-musl.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Linux-musl-pkg
          path: Naqrah-Linux-musl.pkg.tar.zst

  # ===== تغليف حزم Void Linux (بدون بناء) =====
  # بيستنى الباينري الجاهز بس من build-linux-elf (glibc) و build-alpine-elf (musl)،
  # مش لازم ينتظر تغليف deb/rpm ولا حزمة .apk ولا بناء ويندوز
  build-void:
    name: Build Void Linux Packages (.xbps — glibc + musl)
    needs: [build-linux-elf, build-alpine-elf]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          xbps-install -Suy xbps
          xbps-install -Suy
          xbps-install -y base-devel

      - name: Download glibc Binary Artifact (From Ubuntu Job)
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF
          path: void-glibc-src

      - name: Download musl Binary Artifact (From Alpine Job)
        uses: actions/download-artifact@v4
        with:
          name: Naqrah-Linux-ELF-musl
          path: void-musl-src

      - name: Prepare Package Root (glibc)
        run: |
          PKG_ROOT="void-pkg-root"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp void-glibc-src/naqrah-elf-glibc "${PKG_ROOT}/usr/bin/naqrah"
          chmod +x "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

      - name: Build glibc .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64 \
            -n naqrah-1.0.0_1 \
            -s "Arabic text diacritics (Tashkeel) editor" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/Naqrah" \
            --maintainer "ahmed-x86" \
            void-pkg-root

          # التعديل هنا: استخدمنا الاسم الصريح بدل النجمة
          mv naqrah-1.0.0_1.x86_64.xbps Naqrah-Void-glibc.xbps

      - name: Upload Void glibc Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Void-glibc-xbps
          path: Naqrah-Void-glibc.xbps

      - name: Prepare Package Root (musl)
        run: |
          PKG_ROOT="void-pkg-root-musl"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp void-musl-src/naqrah-elf-musllibc "${PKG_ROOT}/usr/bin/naqrah"
          chmod +x "${PKG_ROOT}/usr/bin/naqrah"
          cp naqrah.desktop "${PKG_ROOT}/usr/share/applications/"
          cp iconn.png "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/naqrah.png"

      - name: Build musl .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64-musl \
            -n naqrah-1.0.0_1 \
            -s "Arabic text diacritics (Tashkeel) editor" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/Naqrah" \
            --maintainer "ahmed-x86" \
            void-pkg-root-musl

          # التعديل هنا: استخدمنا الاسم الصريح بدل النجمة
          mv naqrah-1.0.0_1.x86_64-musl.xbps Naqrah-Void-musl.xbps

      - name: Upload Void musl Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Void-musl-xbps
          path: Naqrah-Void-musl.xbps

  # ملاحظة: الـ job ده بيشتغل على ubuntu-latest برضو، لكن ده مش تكرار لبناء Linux desktop.
  # ubuntu هنا مجرد "runner" (بيئة تشغيل) لبناء APK الأندرويد عن طريق NDK + Tauri Android.
  # الناتج هنا (.apk) مختلف تمامًا عن ناتج build-linux-elf / build-windows (ELF / .zip).
  #
  # ده الـ APK "العام/الشامل" (Universal) — بيحتوي على كل المعماريات جوه ملف واحد
  # فبيشتغل على أي جهاز أندرويد بدون ما المستخدم يحتاج يعرف معماريته.
  # حجمه أكبر من نسخ المعماريات المنفصلة، لكنه أسهل وأضمن لمعظم الناس.
  build-android-universal:
    name: Build Android APK (Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-universal

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-universal-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # كاش مجلد gen/android لتفادي إعادة تهيئة مشروع الأندرويد بالكامل كل مرة
      # v2: cache key متغير عشان نتخلص من أي نسخة مكسورة محفوظة سابقاً
      # v3: رفعنا رقم النسخة عشان نتخلص من كاش قديم اتبنى باسم حزمة أندرويد
      # قديم (com.ahmed-x86.nagrah) قبل تصحيح الاسم. وأضفنا هاش ملف الـ
      # workflow نفسه للمفتاح، عشان أي تغيير مستقبلي على identifier (اللي
      # بيتحط بـ sed جوه الملف مش في tauri.conf.json مباشرة) يبطل الكاش
      # تلقائيًا من غير ما نحتاج نرفع رقم النسخة يدويًا كل مرة
      - name: Cache Android project
        uses: actions/cache@v4
        with:
          path: gen/android
          key: android-gen-v3-universal-${{ hashFiles('tauri.conf.json') }}-${{ hashFiles('.github/workflows/release.yml') }}

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.naqrah"/g' tauri.conf.json
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      # نولّد أيقونات كل المنصات (بما فيها أندرويد) من نفس ملف iconn.png
      # عشان أيقونة الـ APK تطابق أيقونة سطح المكتب. لازم تتنفذ بعد تهيئة
      # مجلد gen/android (سواء جديد أو مسترجع من الكاش) عشان تلاقي المسار
      # الصحيح وتحدّث الـ mipmap resources بتاعته.
      - name: Regenerate Icons (sync with iconn.png)
        run: cargo tauri icon iconn.png

      # فك تشفير الـ keystore من السيكرت وحفظه كملف مؤقت للتوقيع
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > naqrah-release.keystore

      # ملف الإعدادات اللي Gradle هيقرأه (بعد ما نربطه بـ build.gradle.kts في الخطوة الجاية)
      - name: Create Signing Properties
        run: |
          cat > gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/naqrah-release.keystore
          EOF

      # الخطوة الحاسمة: Tauri Android CLI مبيربطش keystore.properties بالـ signing تلقائيًا.
      # لازم نضيف signingConfigs في build.gradle.kts يدويًا ونربطها بـ buildTypes.release،
      # وإلا الـ APK هيتبني "unsigned" حتى لو keystore.properties موجود وصحيح.
      #
      # الحل: بدل sed اللي ممكن يكرر الـ imports، نقرأ الملف الأصلي ونكتبه من الصفر بشكل آمن.
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="gen/android/app/build.gradle.kts"

          if ! grep -q "keystore.properties" "$GRADLE_FILE"; then
            # إضافة import java.io.FileInputStream لو مش موجود (java.util.Properties موجود أصلاً من Tauri)
            if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
              sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
            fi

            # إضافة import java.util.Properties بس لو مش موجود أصلاً
            if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
              sed -i '1i import java.util.Properties' "$GRADLE_FILE"
            fi

            # إضافة تحميل keystoreProperties قبل بلوك android {
            sed -i '/^android {/i \
          val keystorePropertiesFile = rootProject.file("keystore.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' "$GRADLE_FILE"

            # إضافة signingConfigs جوه بلوك android { بعد أول سطر مباشرة
            sed -i '/^android {/a \
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String\
                      keyPassword = keystoreProperties["password"] as String\
                      storeFile = file(keystoreProperties["storeFile"] as String)\
                      storePassword = keystoreProperties["password"] as String\
                  }\
              }\
          ' "$GRADLE_FILE"

            # ربط signingConfig بـ buildTypes.release
            sed -i '/getByName("release")/a \
                  signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
          fi

          cat "$GRADLE_FILE"

      # من غير --target: Tauri بيبني ملف APK واحد شامل كل المعماريات جواه
      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk

      # تنظيف الملفات الحساسة فورًا بعد البناء
      - name: Cleanup Keystore
        if: always()
        run: rm -f naqrah-release.keystore gen/android/keystore.properties

      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*universal*release*.apk" ! -name "*unsigned*" -exec cp {} Naqrah-Android.apk \;
          if [ ! -f Naqrah-Android.apk ]; then
            echo "::error::لم يتم إيجاد APK عام موقّع! تأكد من صحة الـ signing config."
            find gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android-universal
          path: Naqrah-Android.apk

  # كل معمارية ليها VM منفصلة وبتبني APK خاص بيها بس (مش universal).
  # ده بيدي 4 ملفات APK صغيرة ومتوقعة زي الأصلية، كل واحد لمعماريته.
  build-android:
    name: Build Android APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - arch: armeabi-v7a          # أندرويد 6 (API 23) فما فوق
            rust_target: armv7-linux-androideabi
            tauri_target: armv7
          - arch: x86
            rust_target: i686-linux-android
            tauri_target: i686
          - arch: x86_64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      # نجيب Rust target بتاع المعمارية دي بس (مش الأربعة) عشان يبقى أسرع
      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.arch }}

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ matrix.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # كاش مجلد gen/android لتفادي إعادة تهيئة مشروع الأندرويد بالكامل كل مرة
      # v2: cache key متغير عشان نتخلص من أي نسخة مكسورة محفوظة سابقاً
      # كل معمارية ليها كاش منفصل عشان الـ 4 VMs بيشتغلوا في نفس الوقت
      # v3: نفس سبب الرفع في build-android-universal (راجع التعليق هناك)
      - name: Cache Android project
        uses: actions/cache@v4
        with:
          path: gen/android
          key: android-gen-v3-${{ matrix.arch }}-${{ hashFiles('tauri.conf.json') }}-${{ hashFiles('.github/workflows/release.yml') }}

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.naqrah"/g' tauri.conf.json
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      # نولّد أيقونات كل المنصات (بما فيها أندرويد) من نفس ملف iconn.png
      # عشان أيقونة الـ APK تطابق أيقونة سطح المكتب. لازم تتنفذ بعد تهيئة
      # مجلد gen/android (سواء جديد أو مسترجع من الكاش) عشان تلاقي المسار
      # الصحيح وتحدّث الـ mipmap resources بتاعته.
      - name: Regenerate Icons (sync with iconn.png)
        run: cargo tauri icon iconn.png

      # فك تشفير الـ keystore من السيكرت وحفظه كملف مؤقت للتوقيع
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > naqrah-release.keystore

      # ملف الإعدادات اللي Gradle هيقرأه (بعد ما نربطه بـ build.gradle.kts في الخطوة الجاية)
      - name: Create Signing Properties
        run: |
          cat > gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/naqrah-release.keystore
          EOF

      # الخطوة الحاسمة: Tauri Android CLI مبيربطش keystore.properties بالـ signing تلقائيًا.
      # لازم نضيف signingConfigs في build.gradle.kts يدويًا ونربطها بـ buildTypes.release،
      # وإلا الـ APK هيتبني "unsigned" حتى لو keystore.properties موجود وصحيح.
      #
      # الحل: بدل sed اللي ممكن يكرر الـ imports، نقرأ الملف الأصلي ونكتبه من الصفر بشكل آمن.
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="gen/android/app/build.gradle.kts"

          if ! grep -q "keystore.properties" "$GRADLE_FILE"; then
            # إضافة import java.io.FileInputStream لو مش موجود (java.util.Properties موجود أصلاً من Tauri)
            if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
              sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
            fi

            # إضافة import java.util.Properties بس لو مش موجود أصلاً
            if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
              sed -i '1i import java.util.Properties' "$GRADLE_FILE"
            fi

            # إضافة تحميل keystoreProperties قبل بلوك android {
            sed -i '/^android {/i \
          val keystorePropertiesFile = rootProject.file("keystore.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' "$GRADLE_FILE"

            # إضافة signingConfigs جوه بلوك android { بعد أول سطر مباشرة
            sed -i '/^android {/a \
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String\
                      keyPassword = keystoreProperties["password"] as String\
                      storeFile = file(keystoreProperties["storeFile"] as String)\
                      storePassword = keystoreProperties["password"] as String\
                  }\
              }\
          ' "$GRADLE_FILE"

            # ربط signingConfig بـ buildTypes.release
            sed -i '/getByName("release")/a \
                  signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
          fi

          cat "$GRADLE_FILE"

      # --target هنا بيخلي Tauri يبني معمارية واحدة بس (بتاعة الـ matrix الحالية)
      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk --target ${{ matrix.tauri_target }}

      # تنظيف الملفات الحساسة فورًا بعد البناء
      - name: Cleanup Keystore
        if: always()
        run: rm -f naqrah-release.keystore gen/android/keystore.properties

      # اسم الملف بيتحط فيه اسم المعمارية عشان يبقى واضح للمستخدم وهو بيحمّل
      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*release*.apk" ! -name "*unsigned*" -exec cp {} Naqrah-Android-${{ matrix.arch }}.apk \;
          if [ ! -f "Naqrah-Android-${{ matrix.arch }}.apk" ]; then
            echo "::error::لم يتم إيجاد APK موقّع لمعمارية ${{ matrix.arch }}! تأكد من صحة الـ signing config."
            find gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android-${{ matrix.arch }}
          path: Naqrah-Android-${{ matrix.arch }}.apk

  release:
    name: Create GitHub Release
    needs: [build-linux-packages, build-linux-packages-musl, build-windows, build-arch, build-arch-musl, build-void, build-alpine-apk, build-android-universal, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # بيبني 3 جداول (لينكس / أندرويد / ويندوز) بدل جدول واحد طويل، كل خانة
      # فيها حجم الملف نفسه وهو كمان رابط تحميل مباشر. الخانات اللي مفيش
      # ليها ملف (زي glibc + apk، لأن أدوات .apk مبنية على Alpine/musl بس)
      # بتتحط "-----" بدالها.
      - name: Generate Download Table
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # يرجع حجم الملف كرابط تحميل Markdown، أو "-----" لو الملف مش موجود أصلاً
          cell() {
            local file="$1"
            local path="artifacts/${file}"
            if [ -f "$path" ]; then
              local size
              size=$(du -h "$path" | cut -f1 | sed 's/[[:space:]]*//g')
              echo "[${size}](${BASE_URL}/${file})"
            else
              echo "-----"
            fi
          }

          {
            echo "## 📦 Naqrah ${TAG}"
            echo ""
            echo "اختر النسخة المناسبة لجهازك من الجدول تحت وحمّلها مباشرة (الحجم نفسه هو رابط التحميل) 👇"
            echo ""

            echo "### 🐧 لينكس (x86_64)"
            echo ""
            echo "| المكتبة \\ الصيغة | ELF | .deb | .rpm | .pkg.tar.zst | .xbps | .apk |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|:---:|"
            echo "| **glibc** | $(cell naqrah-elf-glibc) | $(cell Naqrah-Linux.deb) | $(cell Naqrah-Linux.rpm) | $(cell Naqrah-Linux.pkg.tar.zst) | $(cell Naqrah-Void-glibc.xbps) | ----- |"
            echo "| **musl**  | $(cell naqrah-elf-musllibc) | $(cell Naqrah-Linux-musl.deb) | $(cell Naqrah-Linux-musl.rpm) | $(cell Naqrah-Linux-musl.pkg.tar.zst) | $(cell Naqrah-Void-musl.xbps) | $(cell Naqrah-Alpine.apk) |"
            echo ""

            echo "### 🤖 أندرويد"
            echo ""
            echo "| التحميل \\ المعمارية | x86 | x86_64 | armv7 | armv8 | 🌐 عام (Universal) |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|"
            echo "| **APK** | $(cell Naqrah-Android-x86.apk) | $(cell Naqrah-Android-x86_64.apk) | $(cell Naqrah-Android-armeabi-v7a.apk) | $(cell Naqrah-Android-arm64-v8a.apk) | $(cell Naqrah-Android.apk) |"
            echo ""

            echo "### 🪟 ويندوز"
            echo ""
            echo "| الصيغة \\ المعمارية | x86_64 |"
            echo "|:---|:---:|"
            echo "| **أرشيف (exe + المكتبات)** | $(cell Naqrah-Windows.zip) |"
            echo ""
            echo "---"
            echo ""
            echo "> 🐧 **إيه هو ملف الـ ELF؟** ده صيغة البرامج التنفيذية الأساسية في لينكس (زي .exe في ويندوز). حمّله، وعشان تشغّله: دوس عليه Right Click ثم Properties/خصائص وفعّل خيار \"اجعله قابل للتنفيذ / Executable\"، أو من التيرمنال اكتب:"
            echo ">"
            echo "> \`chmod +x /path/to/file\`"
            echo ">"
            echo "> 📦 **glibc ولا musl؟** لو مش عارف، غالبًا توزيعتك بتستخدم **glibc** (زي Ubuntu، Debian، Fedora، Arch، Void...) وده الاختيار الآمن لمعظم الناس. أما **musl** فبتستخدمها توزيعات زي Alpine، ومستخدميها عادةً عارفين إنهم بيستخدموها."
            echo ">"
            echo "> 💡 **مش عارف تختار (أندرويد)؟** جرّب نسخة **arm64-v8a** لو موبايلك حديث (2018 فما فوق)، أو حمّل النسخة **العامة (Universal)** لو مش عارف معماريتك وعايز خيار آمن يشتغل على أي جهاز."
            echo ""
            echo "---"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}