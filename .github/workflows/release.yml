  # ملاحظة: الـ job ده بيشتغل على ubuntu-latest برضو، لكن ده مش تكرار لبناء Linux desktop.
  # ubuntu هنا مجرد "runner" (بيئة تشغيل) لبناء APK الأندرويد عن طريق NDK + Tauri Android.
  # الناتج هنا (.apk) مختلف تمامًا عن ناتج build-linux-elf / build-windows (ELF / .zip).
  #
  # ده الـ APK "العام/الشامل" (Universal) — بيحتوي على كل المعماريات جوه ملف واحد
  # فبيشتغل على أي جهاز أندرويد بدون ما المستخدم يحتاج يعرف معماريته.
  # حجمه أكبر من نسخ المعماريات المنفصلة، لكنه أسهل وأضمن لمعظم الناس.
  build-android-universal:
    name: Build Android APK (Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-universal

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-universal-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # كاش مجلد gen/android لتفادي إعادة تهيئة مشروع الأندرويد بالكامل كل مرة
      # v2: cache key متغير عشان نتخلص من أي نسخة مكسورة محفوظة سابقاً
      # v3: رفعنا رقم النسخة عشان نتخلص من كاش قديم اتبنى باسم حزمة أندرويد
      # قديم (com.ahmed-x86.nagrah) قبل تصحيح الاسم. وأضفنا هاش ملف الـ
      # workflow نفسه للمفتاح، عشان أي تغيير مستقبلي على identifier (اللي
      # بيتحط بـ sed جوه الملف مش في tauri.conf.json مباشرة) يبطل الكاش
      # تلقائيًا من غير ما نحتاج نرفع رقم النسخة يدويًا كل مرة
      - name: Cache Android project
        uses: actions/cache@v4
        with:
          path: gen/android
          key: android-gen-v3-universal-${{ hashFiles('tauri.conf.json') }}-${{ hashFiles('.github/workflows/release.yml') }}

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.naqrah"/g' tauri.conf.json
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      # نولّد أيقونات كل المنصات (بما فيها أندرويد) من نفس ملف iconn.png
      # عشان أيقونة الـ APK تطابق أيقونة سطح المكتب. لازم تتنفذ بعد تهيئة
      # مجلد gen/android (سواء جديد أو مسترجع من الكاش) عشان تلاقي المسار
      # الصحيح وتحدّث الـ mipmap resources بتاعته.
      - name: Regenerate Icons (sync with iconn.png)
        run: cargo tauri icon iconn.png

      # فك تشفير الـ keystore من السيكرت وحفظه كملف مؤقت للتوقيع
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > naqrah-release.keystore

      # ملف الإعدادات اللي Gradle هيقرأه (بعد ما نربطه بـ build.gradle.kts في الخطوة الجاية)
      - name: Create Signing Properties
        run: |
          cat > gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/naqrah-release.keystore
          EOF

      # الخطوة الحاسمة: Tauri Android CLI مبيربطش keystore.properties بالـ signing تلقائيًا.
      # لازم نضيف signingConfigs في build.gradle.kts يدويًا ونربطها بـ buildTypes.release،
      # وإلا الـ APK هيتبني "unsigned" حتى لو keystore.properties موجود وصحيح.
      #
      # الحل: بدل sed اللي ممكن يكرر الـ imports، نقرأ الملف الأصلي ونكتبه من الصفر بشكل آمن.
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="gen/android/app/build.gradle.kts"

          if ! grep -q "keystore.properties" "$GRADLE_FILE"; then
            # إضافة import java.io.FileInputStream لو مش موجود (java.util.Properties موجود أصلاً من Tauri)
            if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
              sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
            fi

            # إضافة import java.util.Properties بس لو مش موجود أصلاً
            if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
              sed -i '1i import java.util.Properties' "$GRADLE_FILE"
            fi

            # إضافة تحميل keystoreProperties قبل بلوك android {
            sed -i '/^android {/i \
          val keystorePropertiesFile = rootProject.file("keystore.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' "$GRADLE_FILE"

            # إضافة signingConfigs جوه بلوك android { بعد أول سطر مباشرة
            sed -i '/^android {/a \
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String\
                      keyPassword = keystoreProperties["password"] as String\
                      storeFile = file(keystoreProperties["storeFile"] as String)\
                      storePassword = keystoreProperties["password"] as String\
                  }\
              }\
          ' "$GRADLE_FILE"

            # ربط signingConfig بـ buildTypes.release
            sed -i '/getByName("release")/a \
                  signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
          fi

          cat "$GRADLE_FILE"

      # من غير --target: Tauri بيبني ملف APK واحد شامل كل المعماريات جواه
      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk

      # تنظيف الملفات الحساسة فورًا بعد البناء
      - name: Cleanup Keystore
        if: always()
        run: rm -f naqrah-release.keystore gen/android/keystore.properties

      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*universal*release*.apk" ! -name "*unsigned*" -exec cp {} Naqrah-Android.apk \;
          if [ ! -f Naqrah-Android.apk ]; then
            echo "::error::لم يتم إيجاد APK عام موقّع! تأكد من صحة الـ signing config."
            find gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android-universal
          path: Naqrah-Android.apk

  # كل معمارية ليها VM منفصلة وبتبني APK خاص بيها بس (مش universal).
  # ده بيدي 4 ملفات APK صغيرة ومتوقعة زي الأصلية، كل واحد لمعماريته.
  build-android:
    name: Build Android APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - arch: armeabi-v7a          # أندرويد 6 (API 23) فما فوق
            rust_target: armv7-linux-androideabi
            tauri_target: armv7
          - arch: x86
            rust_target: i686-linux-android
            tauri_target: i686
          - arch: x86_64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK ضروري جداً لبناء أكواد Rust للأندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      # نجيب Rust target بتاع المعمارية دي بس (مش الأربعة) عشان يبقى أسرع
      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.arch }}

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ matrix.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      # كاش مجلد gen/android لتفادي إعادة تهيئة مشروع الأندرويد بالكامل كل مرة
      # v2: cache key متغير عشان نتخلص من أي نسخة مكسورة محفوظة سابقاً
      # كل معمارية ليها كاش منفصل عشان الـ 4 VMs بيشتغلوا في نفس الوقت
      # v3: نفس سبب الرفع في build-android-universal (راجع التعليق هناك)
      - name: Cache Android project
        uses: actions/cache@v4
        with:
          path: gen/android
          key: android-gen-v3-${{ matrix.arch }}-${{ hashFiles('tauri.conf.json') }}-${{ hashFiles('.github/workflows/release.yml') }}

      # تعديل الباكدج نيم وبناء مجلد أندرويد برمجياً
      - name: Set Package Name & Init Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/"com.naqrah.dev"/"com.ahmed-x86.naqrah"/g' tauri.conf.json
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      # نولّد أيقونات كل المنصات (بما فيها أندرويد) من نفس ملف iconn.png
      # عشان أيقونة الـ APK تطابق أيقونة سطح المكتب. لازم تتنفذ بعد تهيئة
      # مجلد gen/android (سواء جديد أو مسترجع من الكاش) عشان تلاقي المسار
      # الصحيح وتحدّث الـ mipmap resources بتاعته.
      - name: Regenerate Icons (sync with iconn.png)
        run: cargo tauri icon iconn.png

      # فك تشفير الـ keystore من السيكرت وحفظه كملف مؤقت للتوقيع
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > naqrah-release.keystore

      # ملف الإعدادات اللي Gradle هيقرأه (بعد ما نربطه بـ build.gradle.kts في الخطوة الجاية)
      - name: Create Signing Properties
        run: |
          cat > gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/naqrah-release.keystore
          EOF

      # الخطوة الحاسمة: Tauri Android CLI مبيربطش keystore.properties بالـ signing تلقائيًا.
      # لازم نضيف signingConfigs في build.gradle.kts يدويًا ونربطها بـ buildTypes.release،
      # وإلا الـ APK هيتبني "unsigned" حتى لو keystore.properties موجود وصحيح.
      #
      # الحل: بدل sed اللي ممكن يكرر الـ imports، نقرأ الملف الأصلي ونكتبه من الصفر بشكل آمن.
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="gen/android/app/build.gradle.kts"

          if ! grep -q "keystore.properties" "$GRADLE_FILE"; then
            # إضافة import java.io.FileInputStream لو مش موجود (java.util.Properties موجود أصلاً من Tauri)
            if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
              sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
            fi

            # إضافة import java.util.Properties بس لو مش موجود أصلاً
            if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
              sed -i '1i import java.util.Properties' "$GRADLE_FILE"
            fi

            # إضافة تحميل keystoreProperties قبل بلوك android {
            sed -i '/^android {/i \
          val keystorePropertiesFile = rootProject.file("keystore.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' "$GRADLE_FILE"

            # إضافة signingConfigs جوه بلوك android { بعد أول سطر مباشرة
            sed -i '/^android {/a \
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String\
                      keyPassword = keystoreProperties["password"] as String\
                      storeFile = file(keystoreProperties["storeFile"] as String)\
                      storePassword = keystoreProperties["password"] as String\
                  }\
              }\
          ' "$GRADLE_FILE"

            # ربط signingConfig بـ buildTypes.release
            sed -i '/getByName("release")/a \
                  signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
          fi

          cat "$GRADLE_FILE"

      # --target هنا بيخلي Tauri يبني معمارية واحدة بس (بتاعة الـ matrix الحالية)
      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --apk --target ${{ matrix.tauri_target }}

      # تنظيف الملفات الحساسة فورًا بعد البناء
      - name: Cleanup Keystore
        if: always()
        run: rm -f naqrah-release.keystore gen/android/keystore.properties

      # اسم الملف بيتحط فيه اسم المعمارية عشان يبقى واضح للمستخدم وهو بيحمّل
      - name: Find and Copy APK
        run: |
          find gen/android/app/build/outputs/apk -name "*release*.apk" ! -name "*unsigned*" -exec cp {} Naqrah-Android-${{ matrix.arch }}.apk \;
          if [ ! -f "Naqrah-Android-${{ matrix.arch }}.apk" ]; then
            echo "::error::لم يتم إيجاد APK موقّع لمعمارية ${{ matrix.arch }}! تأكد من صحة الـ signing config."
            find gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Android-${{ matrix.arch }}
          path: Naqrah-Android-${{ matrix.arch }}.apk

  # ===== ماك (MacOS) - Intel & ARM =====
  build-macos:
    name: Build MacOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-bin-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri App
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles app,dmg

      - name: Package Mac
        run: |
          # العثور على ملف dmg إن وجد (نبحث في كل مجلد target لتفادي مشاكل المسارات)
          DMG_FILE=$(find target -type f -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" Naqrah-MacOS-${{ matrix.arch }}.dmg
          else
            echo "لا يوجد ملف DMG، ربما تم تخطيه."
            touch Naqrah-MacOS-${{ matrix.arch }}.dmg # إنشاء ملف فارغ مؤقتاً عشان upload-artifact ما يفشلش لو متوقع الملف
          fi
          
          # العثور على مجلد .app وضغطه
          APP_DIR=$(find target -type d -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            tar -czf Naqrah-MacOS-${{ matrix.arch }}-app.tar.gz -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          else
            echo "لا يوجد مجلد APP!"
            touch Naqrah-MacOS-${{ matrix.arch }}-app.tar.gz
          fi

      - name: Upload MacOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-MacOS-${{ matrix.arch }}-dmg
          path: Naqrah-MacOS-${{ matrix.arch }}.dmg

      - name: Upload MacOS APP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-MacOS-${{ matrix.arch }}-app
          path: Naqrah-MacOS-${{ matrix.arch }}-app.tar.gz

  generate-hashes:
    name: Generate MD5 Hashes
    needs: [build-linux-packages, build-linux-packages-musl, build-linux-elf-arm64, build-linux-packages-arm64, build-alpine-elf-arm64, build-linux-packages-musl-arm64, build-freebsd-elf, build-windows, build-arch, build-arch-arm64, build-arch-musl, build-arch-musl-arm64, build-void-glibc-arm64, build-void-musl-arm64, build-alpine-apk, build-android-universal, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute Hashes
        run: |
          cd artifacts
          md5sum * > ../hashes.txt
          mv ../hashes.txt .
          cat hashes.txt

      - name: Upload Hashes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqrah-Hashes
          path: artifacts/hashes.txt

  release:
    name: Create GitHub Release
    needs: [generate-hashes]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # بيبني 3 جداول (لينكس / أندرويد / ويندوز) بدل جدول واحد طويل، كل خانة
      # فيها حجم الملف نفسه وهو كمان رابط تحميل مباشر. الخانات اللي مفيش
      # ليها ملف (زي glibc + apk، لأن أدوات .apk مبنية على Alpine/musl بس)
      # بتتحط "-----" بدالها.
      - name: Generate Download Table
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # يرجع حجم الملف كرابط تحميل Markdown، أو "-----" لو الملف مش موجود أصلاً
          cell() {
            local file="$1"
            local path="artifacts/${file}"
            if [ -f "$path" ]; then
              local size
              size=$(du -h "$path" | cut -f1 | sed 's/[[:space:]]*//g')
              echo "[${size}](${BASE_URL}/${file})"
            else
              echo "-----"
            fi
          }

          # يرجع هاش MD5 للملف، أو "-----" لو الملف مش موجود
          hash_cell() {
            local file="$1"
            local path="artifacts/${file}"
            if [ -f "$path" ]; then
              local hash
              hash=$(grep "  ${file}$" artifacts/hashes.txt | awk '{print $1}')
              if [ -z "$hash" ]; then
                  echo "-----"
              else
                  echo "\`${hash}\`"
              fi
            else
              echo "-----"
            fi
          }

          {
            echo "## 📦 Naqrah ${TAG}"
            echo ""
            echo "اختر النسخة المناسبة لجهازك من الجدول تحت وحمّلها مباشرة (الحجم نفسه هو رابط التحميل) 👇"
            echo ""

            echo "### 🐧 لينكس (x86_64)"
            echo ""
            echo "| المكتبة \\ الصيغة | ELF | AppImage | .deb | .rpm | .pkg.tar.zst | .xbps | .apk |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|"
            echo "| **glibc** | $(cell naqrah-elf-glibc) | $(cell Naqrah-Linux-glibc.AppImage) | $(cell Naqrah-Linux.deb) | $(cell Naqrah-Linux.rpm) | $(cell Naqrah-Linux.pkg.tar.zst) | $(cell Naqrah-Void-glibc.xbps) | ----- |"
            echo "| **musl**  | $(cell naqrah-elf-musllibc) | ----- | $(cell Naqrah-Linux-musl.deb) | $(cell Naqrah-Linux-musl.rpm) | $(cell Naqrah-Linux-musl.pkg.tar.zst) | $(cell Naqrah-Void-musl.xbps) | $(cell Naqrah-Alpine.apk) |"
            echo ""

            echo "### 🐧 لينكس (aarch64)"
            echo ""
            echo "| المكتبة \\ الصيغة | ELF | .deb | .rpm | .pkg.tar.zst | .xbps | .apk |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|:---:|"
            echo "| **glibc** | $(cell naqrah-elf-glibc-arm64) | $(cell Naqrah-Linux-arm64.deb) | $(cell Naqrah-Linux-arm64.rpm) | $(cell Naqrah-Linux-arm64.pkg.tar.zst) | $(cell Naqrah-Void-glibc-arm64.xbps) | ----- |"
            echo "| **musl**  | $(cell naqrah-elf-musllibc-arm64) | $(cell Naqrah-Linux-musl-arm64.deb) | $(cell Naqrah-Linux-musl-arm64.rpm) | $(cell Naqrah-Linux-musl-arm64.pkg.tar.zst) | $(cell Naqrah-Void-musl-arm64.xbps) | ----- |"
            echo ""

            echo "### FreeBSD (x86_64)"
            echo ""
            echo "| الصيغة \\ المعمارية | x86_64 |"
            echo "|:---|:---:|"
            echo "| **ELF** | $(cell naqrah-elf-freebsd-x86_64) |"
            echo ""

            echo "### 🤖 أندرويد"
            echo ""
            echo "| التحميل \\ المعمارية | x86 | x86_64 | armv7 | armv8 | 🌐 عام (Universal) |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|"
            echo "| **APK** | $(cell Naqrah-Android-x86.apk) | $(cell Naqrah-Android-x86_64.apk) | $(cell Naqrah-Android-armeabi-v7a.apk) | $(cell Naqrah-Android-arm64-v8a.apk) | $(cell Naqrah-Android.apk) |"
            echo ""

            echo "### 🪟 ويندوز"
            echo ""
            echo "| الصيغة \\ المعمارية | x86_64 |"
            echo "|:---|:---:|"
            echo "| **أرشيف (exe + المكتبات)** | $(cell Naqrah-Windows.zip) |"
            echo ""
            
            echo "### 🍎 ماك (MacOS)"
            echo ""
            echo "| الصيغة \\ المعمارية | Apple Silicon (M1/M2) | Intel (x86_64) |"
            echo "|:---|:---:|:---:|"
            echo "| **DMG** | $(cell Naqrah-MacOS-aarch64.dmg) | $(cell Naqrah-MacOS-x86_64.dmg) |"
            echo "| **APP (tar.gz)** | $(cell Naqrah-MacOS-aarch64-app.tar.gz) | $(cell Naqrah-MacOS-x86_64-app.tar.gz) |"
            echo ""

            echo "---"
            echo "## 🔐 التحقق من الملفات (MD5 Hashes)"
            echo "للتأكد من سلامة الملفات، يمكنك مطابقة الـ MD5 Hash الخاص بالملف المحمل مع الجداول أدناه. كما تم إرفاق ملف \`hashes.txt\` مع الإصدار."
            echo ""

            echo "### 🐧 لينكس (x86_64)"
            echo ""
            echo "| المكتبة \\ الصيغة | ELF | AppImage | .deb | .rpm | .pkg.tar.zst | .xbps | .apk |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|"
            echo "| **glibc** | $(hash_cell naqrah-elf-glibc) | $(hash_cell Naqrah-Linux-glibc.AppImage) | $(hash_cell Naqrah-Linux.deb) | $(hash_cell Naqrah-Linux.rpm) | $(hash_cell Naqrah-Linux.pkg.tar.zst) | $(hash_cell Naqrah-Void-glibc.xbps) | ----- |"
            echo "| **musl**  | $(hash_cell naqrah-elf-musllibc) | ----- | $(hash_cell Naqrah-Linux-musl.deb) | $(hash_cell Naqrah-Linux-musl.rpm) | $(hash_cell Naqrah-Linux-musl.pkg.tar.zst) | $(hash_cell Naqrah-Void-musl.xbps) | $(hash_cell Naqrah-Alpine.apk) |"
            echo ""

            echo "### 🐧 لينكس (aarch64)"
            echo ""
            echo "| المكتبة \\ الصيغة | ELF | .deb | .rpm | .pkg.tar.zst | .xbps | .apk |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|:---:|"
            echo "| **glibc** | $(hash_cell naqrah-elf-glibc-arm64) | $(hash_cell Naqrah-Linux-arm64.deb) | $(hash_cell Naqrah-Linux-arm64.rpm) | $(hash_cell Naqrah-Linux-arm64.pkg.tar.zst) | $(hash_cell Naqrah-Void-glibc-arm64.xbps) | ----- |"
            echo "| **musl**  | $(hash_cell naqrah-elf-musllibc-arm64) | $(hash_cell Naqrah-Linux-musl-arm64.deb) | $(hash_cell Naqrah-Linux-musl-arm64.rpm) | $(hash_cell Naqrah-Linux-musl-arm64.pkg.tar.zst) | $(hash_cell Naqrah-Void-musl-arm64.xbps) | ----- |"
            echo ""

            echo "### FreeBSD (x86_64)"
            echo ""
            echo "| الصيغة \\ المعمارية | x86_64 |"
            echo "|:---|:---:|"
            echo "| **ELF** | $(hash_cell naqrah-elf-freebsd-x86_64) |"
            echo ""

            echo "### 🤖 أندرويد"
            echo ""
            echo "| التحميل \\ المعمارية | x86 | x86_64 | armv7 | armv8 | 🌐 عام (Universal) |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|"
            echo "| **APK** | $(hash_cell Naqrah-Android-x86.apk) | $(hash_cell Naqrah-Android-x86_64.apk) | $(hash_cell Naqrah-Android-armeabi-v7a.apk) | $(hash_cell Naqrah-Android-arm64-v8a.apk) | $(hash_cell Naqrah-Android.apk) |"
            echo ""

            echo "### 🪟 ويندوز"
            echo ""
            echo "| الصيغة \\ المعمارية | x86_64 |"
            echo "|:---|:---:|"
            echo "| **أرشيف (exe + المكتبات)** | $(hash_cell Naqrah-Windows.zip) |"
            echo ""
            
            echo "### 🍎 ماك (MacOS)"
            echo ""
            echo "| الصيغة \\ المعمارية | Apple Silicon (M1/M2) | Intel (x86_64) |"
            echo "|:---|:---:|:---:|"
            echo "| **DMG** | $(hash_cell Naqrah-MacOS-aarch64.dmg) | $(hash_cell Naqrah-MacOS-x86_64.dmg) |"
            echo "| **APP (tar.gz)** | $(hash_cell Naqrah-MacOS-aarch64-app.tar.gz) | $(hash_cell Naqrah-MacOS-x86_64-app.tar.gz) |"
            echo ""
            
            echo "---"
            echo ""
            echo "> 🐧 **إيه هو ملف الـ ELF؟** ده صيغة البرامج التنفيذية الأساسية في لينكس (زي .exe في ويندوز). حمّله، وعشان تشغّله: دوس عليه Right Click ثم Properties/خصائص وفعّل خيار \"اجعله قابل للتنفيذ / Executable\"، أو من التيرمنال اكتب:"
            echo ">"
            echo "> \`chmod +x /path/to/file\`"
            echo ">"
            echo "> 📦 **glibc ولا musl؟** لو مش عارف، غالبًا توزيعتك بتستخدم **glibc** (زي Ubuntu، Debian، Fedora، Arch، Void...) وده الاختيار الآمن لمعظم الناس. أما **musl** فبتستخدمها توزيعات زي Alpine، ومستخدميها عادةً عارفين إنهم بيستخدموها."
            echo ">"
            echo "> 💡 **مش عارف تختار (أندرويد)؟** جرّب نسخة **arm64-v8a** لو موبايلك حديث (2018 فما فوق)، أو حمّل النسخة **العامة (Universal)** لو مش عارف معماريتك وعايز خيار آمن يشتغل على أي جهاز."
            echo ""
            echo "---"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}